        .sidebar-nav a { display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: #a0aec0; text-decoration: none; font-size: 14px; cursor: pointer; border-left: 3px solid transparent; }
        .sidebar-nav a:hover, .sidebar-nav a.active { background: #2d3748; color: white; }
        .sidebar-nav a.active { border-left-color: var(--primary); }
        .sidebar-divider { padding: 8px 20px; font-size: 10px; color: #718096; text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } .sidebar { width: 55px; } .sidebar-nav a span, .sidebar-logo h1, .sidebar-divider { display: none; } .main { margin-left: 55px; } }
        
        .card { background: var(--card); border-radius: 12px; padding: 22px; box-shadow: var(--shadow); margin-bottom: 20px; }
        .card-header { font-size: 17px; font-weight: 700; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }

        .btn-warning { background: var(--warning); }
        .btn-danger { background: var(--danger); }
        .btn-accent { background: var(--accent); }
        .btn-whatsapp { background: #25D366; }
        .btn-sm { padding: 6px 12px; font-size: 11px; }
        .btn-xs { padding: 5px 10px; font-size: 11px; border-radius: 4px; }
        
        input, select { width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: 8px; font-size: 14px; margin-bottom: 10px; background: white; }
        .form-row { display: flex; gap: 10px; }
        .form-row > * { flex: 1; }
        label { font-size: 12px; font-weight: 600; color: #4a5568; display: block; margin-bottom: 3px; }
        
        table { width: 100%; border-collapse: collapse; }

        .modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }

        .mensaje-flotante { position: fixed; bottom: 20px; right: 20px; background: #27ae60; color: white; padding: 12px 20px; border-radius: 8px; z-index: 1000; animation: fadeOut 3s ease-in-out; }

        .chart-container { position: relative; width: 100%; max-height: 300px; }
        .lote-grupo { margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .lote-grupo-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #f7fafc; cursor: pointer; font-weight: 600; }
        .lote-grupo-body { padding: 0 14px 8px 14px; display: none; }
        .lote-grupo-body.open { display: block; }
    </style>
</head>

    <div id="modalContainer"></div>

    <script>
        // ============ CONFIGURACION ============
        const API_URL = 'https://script.google.com/macros/s/AKfycbyRZG-_uWbF9fWp5_5um_YBMsCyDhvkDAAUwn_up-kAVHiS4earMyS3m1ec2HSlKwrC0A/exec';
        const MIN_SACOS = 6;
        
        // ============ BASE DE DATOS ============
        let DB = {
            lotes: [], curva: [], protocolos: [], stock: [],
            gastos: [], clientes: [], ventasCredito: [], ventasContado: [],
            abonos: [], mortalidad: [], anulaciones: [], carneStock: []
        };
        
        // ============ RECETAS ============
        const RECETAS = {
            "Pato Inicio":{"Maiz":278,"Torta de Soya 45":170,"Harina Integral Soya":23,"Afrecho":10.5,"Carbonato de Calcio":6,"Sal":1.5,"Fungiban 50%":0.5,"Cloruro de Colina":0.5,"Nucleo Pato Inicio":10},
            "Pato Crecimiento":{"Maiz":309.5,"Torta de Soya 45":157,"Harina Integral Soya":12,"Aceite Vegetal":4,"Carbonato de Calcio":5.2,"Sal":1.3,"Fungiban 50%":0.5,"Cloruro de Colina":0.5,"Nucleo Pato Crecimiento":10},
            "Pato Acabado":{"Maiz":323.5,"Torta de Soya 45":137,"Harina Integral Soya":17.5,"Aceite Vegetal":5,"Carbonato de Calcio":4.7,"Sal":1.3,"Fungiban 50%":0.5,"Cloruro de Colina":0.5,"Nucleo Pato Acabado":10},
            "Cerdo Inicio":{"Maiz":282.5,"Torta de Soya 45":193.5,"Aceite Vegetal":8.5,"Carbonato de Calcio":4.4,"Sal":1.6,"Fungiban 50%":0.5,"Cloruro de Colina":0.5,"Nucleo Cerdo Inicio":8.5},
            "Cerdo Crecimiento":{"Maiz":342.2,"Torta de Soya 45":135,"Aceite Vegetal":6.5,"Carbonato de Calcio":4.5,"Sal":1.8,"Fungiban 50%":0.5,"Cloruro de Colina":0.5,"Nucleo Cerdo Crecimiento":9},
            "Cerdo Desarrollo":{"Maiz":359,"Torta de Soya 45":123,"Aceite Vegetal":5,"Carbonato de Calcio":4.1,"Sal":1.9,"Fungiban 50%":0.5,"Cloruro de Colina":0.5,"Nucleo Cerdo Desarrollo":6},
            "Cerdo Acabado":{"Maiz":363.6,"Torta de Soya 45":118,"Aceite Vegetal":3.5,"Carbonato de Calcio":3.9,"Sal":2.0,"Fungiban 50%":0.5,"Cloruro de Colina":0.5,"Nucleo Cerdo Acabado":8}
        };
        
        const INSUMOS = ["Corimicyn","Maiz","Torta de Soya 45","Harina Integral Soya","Afrecho","Aceite Vegetal","Carbonato de Calcio","Sal","Fungiban 50%","Cloruro de Colina","Nucleo Pato Inicio","Nucleo Pato Crecimiento","Nucleo Pato Acabado","Nucleo Cerdo Inicio","Nucleo Cerdo Crecimiento","Nucleo Cerdo Desarrollo","Nucleo Cerdo Acabado"];
        const LISTA_NUCLEOS = ["Nucleo Pato Inicio","Nucleo Pato Crecimiento","Nucleo Pato Acabado","Nucleo Cerdo Inicio","Nucleo Cerdo Crecimiento","Nucleo Cerdo Desarrollo","Nucleo Cerdo Acabado"];
        const NUCLEOS_KG = {"Nucleo Pato Inicio":10,"Nucleo Pato Crecimiento":10,"Nucleo Pato Acabado":10,"Nucleo Cerdo Inicio":8.5,"Nucleo Cerdo Crecimiento":9,"Nucleo Cerdo Desarrollo":6,"Nucleo Cerdo Acabado":8};
        
        let vistaActual = localStorage.getItem('erp_vista') || 'dashboard';
        
        function guardarStorage() {
            localStorage.setItem('erp_lotes', JSON.stringify(DB.lotes));
            localStorage.setItem('erp_stock', JSON.stringify(DB.stock));
            localStorage.setItem('erp_clientes', JSON.stringify(DB.clientes));
            localStorage.setItem('erp_ventas_credito', JSON.stringify(DB.ventasCredito));
            localStorage.setItem('erp_ventas_contado', JSON.stringify(DB.ventasContado));
            localStorage.setItem('erp_abonos', JSON.stringify(DB.abonos));
            localStorage.setItem('erp_gastos', JSON.stringify(DB.gastos));
            localStorage.setItem('erp_mortalidad', JSON.stringify(DB.mortalidad));
            localStorage.setItem('erp_carne_stock', JSON.stringify(DB.carneStock));
            localStorage.setItem('erp_curva', JSON.stringify(DB.curva));
            localStorage.setItem('erp_protocolos', JSON.stringify(DB.protocolos));
        }
        
        function mostrarMensaje(texto) {
            let msg = document.createElement('div');
            msg.className = 'mensaje-flotante';
            msg.textContent = texto;
            document.body.appendChild(msg);
            setTimeout(() => msg.remove(), 3000);
        }
        
        function semF(f) { if(!f) return 1; let s = Math.floor(Math.floor((new Date()-new Date(f+'T00:00:00'))/86400000)/7)+1; return s<1?1:s; }
        function diaF(f) { if(!f) return 1; return Math.floor((new Date()-new Date(f+'T00:00:00'))/86400000)+1; }
        function cDiario(esp,sem){ let c = DB.curva.find(x=>x.semana==sem); if(!c) return 0; if(esp==="Patos") return ((c.patoMacho||0)+(c.patoHembra||0))/2/7; if(esp.includes("Macho")) return (c.patoMacho||0)/7; if(esp.includes("Hembra")) return (c.patoHembra||0)/7; if(esp==="Cerdos") return (c.cerdo||0)/7; return 0; }
        function cSemanal(esp,sem){ let c = DB.curva.find(x=>x.semana==sem); if(!c) return 0; if(esp==="Patos") return ((c.patoMacho||0)+(c.patoHembra||0))/2; if(esp.includes("Macho")) return c.patoMacho||0; if(esp.includes("Hembra")) return c.patoHembra||0; if(esp==="Cerdos") return c.cerdo||0; return 0; }
        
        function getFormula(esp, sem){
            if(esp.includes("Pato") || esp === "Patos") {
                if(sem === 1) return "Corimicyn";
                if(sem <= 3) return "Pato Inicio";
                if(sem <= 7) return "Pato Crecimiento";
                return "Pato Acabado";
            }
            if(sem <= 4) return "Cerdo Inicio";
            if(sem <= 7) return "Cerdo Crecimiento";
            if(sem <= 10) return "Cerdo Desarrollo";
            return "Cerdo Acabado";
        }
        
        function getFaseInfo(esp,sem){
            if(esp.includes("Pato")||esp==="Patos"){
                if(sem===1) return {nombre:"Corimicyn",nucleo:null};
                if(sem<=3) return {nombre:"Pato Inicio",nucleo:"Nucleo Pato Inicio"};
                if(sem<=7) return {nombre:"Pato Crecimiento",nucleo:"Nucleo Pato Crecimiento"};
                return {nombre:"Pato Acabado",nucleo:"Nucleo Pato Acabado"};
            }
            if(sem<=4) return {nombre:"Cerdo Inicio",nucleo:"Nucleo Cerdo Inicio"};
            if(sem<=7) return {nombre:"Cerdo Crecimiento",nucleo:"Nucleo Cerdo Crecimiento"};
            if(sem<=10) return {nombre:"Cerdo Desarrollo",nucleo:"Nucleo Cerdo Desarrollo"};
            return {nombre:"Cerdo Acabado",nucleo:"Nucleo Cerdo Acabado"};
        }
        
        // ============ GUARDAR EN SHEETS ============
        async function exportarRespaldo() {
            mostrarMensaje('💾 Guardando en Google Sheets...');
            try {
                const datos = {
                    lotes: DB.lotes, stock: DB.stock, clientes: DB.clientes,
                    ventasCredito: DB.ventasCredito, ventasContado: DB.ventasContado,
                    abonos: DB.abonos, gastosList: DB.gastos, mortalidad: DB.mortalidad,
                    nevera: DB.carneStock, curva: DB.curva, protocolos: DB.protocolos
                };
                await fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) });
                mostrarMensaje('✅ Solicitud enviada a Google Sheets');
            } catch(e) { mostrarMensaje('❌ Error: ' + e.message); }
        }
        
        async function importarRespaldo() {
            mostrarMensaje('📁 Cargando desde Google Sheets...');
            try {
                const response = await fetch(API_URL + '?action=cargar');
                const data = await response.json();
                if (data.success && data.datos) {
                    if (data.datos.lotes) DB.lotes = data.datos.lotes;
                    if (data.datos.stock) DB.stock = data.datos.stock;
                    if (data.datos.clientes) DB.clientes = data.datos.clientes;
                    if (data.datos.ventasCredito) DB.ventasCredito = data.datos.ventasCredito;
                    if (data.datos.ventasContado) DB.ventasContado = data.datos.ventasContado;
                    if (data.datos.abonos) DB.abonos = data.datos.abonos;
                    if (data.datos.gastosList) DB.gastos = data.datos.gastosList;
                    if (data.datos.mortalidad) DB.mortalidad = data.datos.mortalidad;
                    if (data.datos.nevera) DB.carneStock = data.datos.nevera;
                    guardarStorage();
                    renderizar(vistaActual);
                    mostrarMensaje('✅ Datos cargados desde Google Sheets');
                } else { mostrarMensaje('❌ Error: ' + (data.error || 'No hay datos')); }
            } catch(e) { mostrarMensaje('❌ Error de conexion: ' + e.message); }
        }
        
        function agregarBotonesRespaldo() {
            let topbar = document.querySelector('.topbar');
            if (topbar && !document.getElementById('btnExportar')) {
                let btnExportar = document.createElement('button');
                btnExportar.id = 'btnExportar'; btnExportar.className = 'btn btn-accent btn-sm';
                btnExportar.style.marginRight = '8px'; btnExportar.innerHTML = '💾 Guardar en Sheets';
                btnExportar.onclick = exportarRespaldo;
                let btnImportar = document.createElement('button');
                btnImportar.id = 'btnImportar'; btnImportar.className = 'btn btn-warning btn-sm';
                btnImportar.innerHTML = '📁 Cargar desde Sheets';
                btnImportar.onclick = importarRespaldo;
                topbar.appendChild(btnExportar); topbar.appendChild(btnImportar);
            }
        }
        
        // ============ MODAL Y TICKETS ============
        function mostrarModal(titulo, contenido, cb) {
            let cont = document.getElementById('modalContainer');
            cont.innerHTML = '<div class="modal-overlay" id="modalOverlay"><div class="modal"><h3>' + titulo + '</h3><div>' + contenido + '</div><div class="modal-actions"><button class="btn btn-accent" onclick="cerrarModal()">Cancelar</button><button class="btn btn-primary" id="modalConfirmBtn">Confirmar</button></div></div></div>';
            document.getElementById('modalOverlay').onclick = function(e) { if(e.target === this) cerrarModal(); };
            document.getElementById('modalConfirmBtn').onclick = function() { cerrarModal(); if(cb) cb(); };
        }
        function cerrarModal() { document.getElementById('modalContainer').innerHTML = ''; }
        
        async function enviarWhatsAppImagen(ticketHTML) {
            let contenedor = document.createElement('div'); contenedor.id = 'ticketParaCaptura'; contenedor.innerHTML = ticketHTML;
            contenedor.style.position = 'fixed'; contenedor.style.top = '0'; contenedor.style.left = '-9999px'; contenedor.style.width = '420px'; contenedor.style.background = 'white'; contenedor.style.padding = '20px'; contenedor.style.fontFamily = "'Courier New', monospace";
            document.body.appendChild(contenedor);
            try { await new Promise(r => setTimeout(r, 300)); let canvas = await html2canvas(contenedor, { backgroundColor: '#ffffff', scale: 2 }); let blob = await new Promise(r => canvas.toBlob(r, 'image/png')); let file = new File([blob], 'ticket.png', { type: 'image/png' }); if(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Ticket' }); } else { let url = URL.createObjectURL(blob); let a = document.createElement('a'); a.href = url; a.download = 'ticket.png'; a.click(); setTimeout(() => { window.open('https://wa.me/?text=' + encodeURIComponent('Ticket'), '_blank'); URL.revokeObjectURL(url); }, 500); } } catch(e) { window.open('https://wa.me/?text=' + encodeURIComponent('El Porton'), '_blank'); }
            document.body.removeChild(contenedor);
        }
        
        function mostrarTicket(tipo, datos) {
            let hoy = new Date().toLocaleDateString('es-PE');
            let du = datos.especie && datos.especie.includes('Pato') ? '<p><b>Cabezas:</b> ' + (datos.cabezas||datos.cantidad) + '</p><p><b>Peso:</b> ' + datos.kg + ' kg</p>' : '<p><b>Cantidad:</b> ' + datos.cantidad + ' kg</p>';
            let ticketHTML = '<div style="text-align:center;border-bottom:2px dashed #000;padding-bottom:10px;"><h2>🌾 El Porton de la Calichera 🌽</h2><p>997 884 114</p><p>-------------------------</p><p><b>TICKET DE VENTA</b></p><p>N° ' + (datos.id||'T'+Date.now().toString().slice(-6)) + ' | ' + (tipo==='contado'?'CONTADO':'CREDITO') + '</p><p>' + (datos.fecha||hoy) + '</p></div><p><b>Cliente:</b> ' + datos.cliente + '</p><p>-------------------------</p><p><b>' + datos.especie + '</b></p>' + du + '<p><b>Precio:</b> S/ ' + parseFloat(datos.precio).toFixed(2) + '/kg</p><div style="border-top:2px solid #000;padding-top:8px;font-size:20px;font-weight:700;text-align:right;">TOTAL: S/ ' + parseFloat(datos.total).toFixed(2) + '</div><p style="text-align:center;">' + (tipo==='contado'?'PAGADO':'PENDIENTE') + '</p>';
            let cont = document.getElementById('modalContainer');
            cont.innerHTML = '<div class="modal-overlay" id="mo"><div class="modal" style="max-width:480px;"><h3>🧾 Ticket</h3><div class="ticket">' + ticketHTML + '</div><div class="modal-actions"><button class="btn btn-whatsapp" id="btnW">💬</button><button class="btn btn-accent" onclick="window.print()">🖨️</button><button class="btn btn-primary" onclick="cerrarModal()">Cerrar</button></div></div></div>';

        // ============ DASHBOARD ============
        function vDashboard(){
            let ta = DB.lotes.reduce((s,l)=>s+l.cantidad,0), cd = 0, ps = {};
            DB.lotes.forEach(l=>{let s=semF(l.fechaLlegada), d=cDiario(l.especie,s); cd += l.cantidad*d; let f=getFormula(l.especie,s); ps[f] = (ps[f]||0) + (l.cantidad*d*7);});
            let dt=0; DB.clientes.forEach(c=>{let tv=DB.ventasCredito.filter(v=>v.clienteId===c.id&&!v.anulado).reduce((s,v)=>s+v.total,0), ta2=DB.abonos.filter(a=>a.clienteId===c.id).reduce((s,a)=>s+a.monto,0); dt += Math.max(0,tv-ta2);});
            let carneKg = DB.carneStock.reduce((s,c)=>s+c.kg,0);
            
            let diasRestante = '';
            let ps2 = {};
            DB.lotes.forEach(l => { let s = semF(l.fechaLlegada); let d = cDiario(l.especie, s); let f = getFormula(l.especie, s); ps2[f] = (ps2[f] || 0) + (l.cantidad * d); });
            for (let f in ps2) {
                let item = DB.stock.find(x => x.nombre === ('🥣 ' + f)) || DB.stock.find(x => x.nombre === f);
                let stock = item ? Math.max(0, parseFloat(item.cantidad) || 0) : 0;
                let dias = ps2[f] > 0 ? Math.floor(stock / ps2[f]) : 99;
                let icono = dias <= 1 ? '🔴' : dias <= 3 ? '🟡' : '🟢';
                diasRestante += '<div>' + icono + ' <b>' + f + ':</b> ' + dias + ' dias (' + stock.toFixed(1) + ' kg)</div>';
            }
            
            let tHoy = '';
            DB.lotes.forEach(l=>{ let d = diaF(l.fechaLlegada); let tp = l.especie.toLowerCase().includes('pato') ? 'pato' : 'cerdo'; DB.protocolos.forEach(p=>{ if(p.especie.toLowerCase().includes(tp) && d>=p.diaInicio && d<=p.diaFin){ tHoy += '<div class="tarea-item tarea-hoy"><div class="tarea-badge" style="background:#e74c3c">HOY</div><div><b>' + l.id + ':</b> ' + p.tarea + '</div></div>'; } }); });
            if(!tHoy) tHoy = '<p>Sin tareas hoy</p>';
            
            let alertasHTML = '';
            DB.stock.forEach(s=>{ let c = parseFloat(s.cantidad)||0; if(c<=0 && s.nombre && s.nombre!="0") alertasHTML += '<div class="alerta-item alerta-critica"><b>🔴 ' + s.nombre + ' AGOTADO</b></div>'; else if(c<10) alertasHTML += '<div class="alerta-item alerta-warning"><b>🟡 ' + s.nombre + ':</b> ' + c.toFixed(2) + ' kg</div>'; });
            
            let labelsStock = [], dataStock = [];
            DB.stock.forEach(s => { let c = parseFloat(s.cantidad) || 0; if(c > 0 && s.nombre && !s.nombre.startsWith("Animales:") && !s.nombre.startsWith("GASTO:")) { labelsStock.push(s.nombre.length > 15 ? s.nombre.substring(0,15)+'...' : s.nombre); dataStock.push(c); } });
            if(labelsStock.length > 10) { labelsStock = labelsStock.slice(0,10); dataStock = dataStock.slice(0,10); }
            
            return '<div class="topbar"><h2>📊 Inicio</h2></div><div class="kpi-row"><div class="kpi-card kpi-green"><div class="kpi-val">' + ta + '</div><div class="kpi-lbl">Animales</div></div><div class="kpi-card kpi-green"><div class="kpi-val">' + cd.toFixed(2) + ' kg</div><div class="kpi-lbl">Comida/Dia</div></div><div class="kpi-card kpi-red"><div class="kpi-val">S/ ' + dt.toFixed(0) + '</div><div class="kpi-lbl">Por Cobrar</div></div><div class="kpi-card kpi-blue"><div class="kpi-val">' + carneKg.toFixed(1) + ' kg</div><div class="kpi-lbl">Nevera</div></div></div><div class="grid-2"><div class="card"><div class="card-header">📅 Dias de Alimento</div>' + diasRestante + '</div><div class="card"><div class="card-header">📋 Tareas HOY</div>' + tHoy + '</div></div><div class="grid-2"><div class="card"><div class="card-header">📦 Stock</div><div class="chart-container"><canvas id="graficoStock"></canvas></div></div><div class="card"><div class="card-header">🔔 Alertas</div>' + alertasHTML + '</div></div><div id="graficosData" style="display:none;" data-labels-stock=\'' + JSON.stringify(labelsStock) + '\' data-data-stock=\'' + JSON.stringify(dataStock) + '\'></div>';
        }

        function actOrigen(){ let o = document.getElementById('vOrigen')?.value; document.getElementById('vLoteDiv').style.display = o==='lote'?'block':'none'; document.getElementById('vNeveraDiv').style.display = o==='nevera'?'block':'none'; if(o==='lote') actLoteV(); }
        function actLoteV(){ let idx = document.getElementById('vLote')?.value; if(idx==="") return; let l = DB.lotes[idx]; if(l.especie.includes('Pato')){ document.getElementById('vPatosFields').style.display='block'; document.getElementById('vCerdoFields').style.display='none'; } else { document.getElementById('vPatosFields').style.display='none'; document.getElementById('vCerdoFields').style.display='block'; } calcTotV(); }
        function calcTotV(){ let o = document.getElementById('vOrigen')?.value, pr = parseFloat(document.getElementById('vPrecio')?.value)||0, kg = 0; if(o==='lote'){ let idx = document.getElementById('vLote')?.value; if(idx==="") return; let l = DB.lotes[idx]; kg = l.especie.includes('Pato') ? (parseFloat(document.getElementById('vKg')?.value)||0) : (parseFloat(document.getElementById('vKgCerdo')?.value)||0); } else if(o==='nevera'){ kg = parseFloat(document.getElementById('vKgNevera')?.value)||0; } let r = document.getElementById('vResumen'); if(kg>0 && pr>0){ r.style.display='block'; r.innerHTML = '💰 S/ ' + (kg*pr).toFixed(2); } else { r.style.display='none'; } }
        function vender(tipo){ let c = getClienteV(); if(!c) return; let o = document.getElementById('vOrigen')?.value, pr = parseFloat(document.getElementById('vPrecio')?.value); if(!pr) return alert("Precio"); let kg = 0, cb = 0, esp = '', lid = ''; if(o==='lote'){ let idx = document.getElementById('vLote')?.value; if(idx==="") return; let l = DB.lotes[idx]; esp = l.especie; lid = l.id; if(l.especie.includes('Pato')){ cb = parseInt(document.getElementById('vCabezas')?.value)||0; kg = parseFloat(document.getElementById('vKg')?.value)||0; if(!cb||!kg) return; if(cb > l.cantidad) return alert("Solo " + l.cantidad); } else { kg = parseFloat(document.getElementById('vKgCerdo')?.value)||0; if(!kg) return; } } else { kg = parseFloat(document.getElementById('vKgNevera')?.value)||0; if(!kg) return; let ni = document.getElementById('vNevera')?.value; if(ni==="") return; let nc = DB.carneStock[ni]; if(kg > nc.kg) return; esp = nc.especie; lid = nc.lote; } let t = kg * pr; mostrarModal(tipo==='contado'?'Venta Contado':'Venta Credito', c.nombre + '<br>' + kg + ' kg<br><b>TOTAL: S/ ' + t.toFixed(2) + '</b>', () => { let v = { id: (tipo==='contado'?'VC_':'VCR_')+Date.now(), clienteId: c.id, loteId: lid, especie: esp, kg: kg, precio: pr, total: t, fecha: new Date().toISOString().split('T')[0], anulado: false, cabezas: cb }; if(tipo==='contado'){ DB.ventasContado.push(v); } else { DB.ventasCredito.push(v); } if(o==='lote'){ let l = DB.lotes.find(x=>x.id===lid); if(l){ if(l.especie.includes('Pato')) l.cantidad -= cb; else l.cantidad -= Math.ceil(kg/100); if(l.cantidad<=0) DB.lotes = DB.lotes.filter(x=>x.id!==lid); guardarStorage(); } } else { let ni = document.getElementById('vNevera')?.value; let itemN = DB.carneStock[ni]; itemN.kg -= kg; if(itemN.kg<=0.01) DB.carneStock.splice(ni,1); guardarStorage(); } sincronizar(); initVentas(); mostrarTicket(tipo, {cliente: c.nombre, especie: esp, cantidad: cb||kg, cabezas: cb, kg: kg, precio: pr, total: t.toFixed(2)}); }); }
        function renderUltimasV(){ let div = document.getElementById('ultimasV'); if(!div) return; let todas = [...DB.ventasContado, ...DB.ventasCredito].sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,5); div.innerHTML = !todas.length ? '<p>Sin ventas.</p>' : '<table><thead><tr><th>Fecha</th><th>Total</th></tr></thead><tbody>' + todas.map(v=>'<tr><td>' + v.fecha + '</td><td>S/ ' + v.total.toFixed(2) + '</td></tr>').join('') + '</tbody></table>'; }
        
        // ============ CLIENTES ============
        let cliA = null;
        function buscarClienteA(){ let i = document.getElementById('buscarClienteA'), dd = document.getElementById('dropdownClientesA'), t = (i?.value||'').toLowerCase(); if(!dd) return; let f = DB.clientes.filter(c=>c.nombre.toLowerCase().includes(t)); dd.innerHTML = f.map(c=>'<div onclick="selCliA(\'' + c.id + '\',\'' + c.nombre + '\')">👤 ' + c.nombre + '</div>').join(''); dd.classList.add('show'); }
        function selCliA(id,n){ cliA = {id:id, nombre:n}; document.getElementById('buscarClienteA').value = n; document.getElementById('dropdownClientesA').classList.remove('show'); actAbonoInfo(id); }
        function actAbonoInfo(cid){ let info = document.getElementById('abonoInfo'); if(!info||!cid){ if(info) info.style.display='none'; return; } let c = DB.clientes.find(x=>x.id===cid); if(!c) return; let tv = DB.ventasCredito.filter(v=>v.clienteId===cid&&!v.anulado).reduce((s,v)=>s+v.total,0), ta = DB.abonos.filter(a=>a.clienteId===cid).reduce((s,a)=>s+a.monto,0); info.style.display='block'; info.innerHTML = '<b>' + c.nombre + '</b><br>🧾 Deuda: S/ ' + tv.toFixed(2) + '<br>💵 Abonado: S/ ' + ta.toFixed(2) + '<br><b>🔴 Pendiente: S/ ' + (tv-ta).toFixed(2) + '</b>'; }
        function vClientes(){ return '<div class="topbar"><h2>👥 Clientes</h2></div><div class="grid-2"><div class="card"><div class="card-header">💰 Abono</div><div class="cliente-search"><input type="text" id="buscarClienteA" placeholder="Buscar cliente..." oninput="buscarClienteA()" autocomplete="off"><div class="cliente-dropdown" id="dropdownClientesA"></div></div><div id="abonoInfo" style="display:none;"></div><input type="number" id="abonoMonto" placeholder="Monto"><select id="abonoMetodo"><option>Efectivo</option><option>Transferencia</option></select><input type="date" id="abonoFecha"><button class="btn btn-primary" onclick="regAbono()">Registrar</button></div><div class="card"><div class="card-header">📋 Clientes <button class="btn btn-accent btn-sm" onclick="nuevoCliente()">➕</button></div><div id="listaClientesDeuda"></div></div></div>'; }
        function initClientes(){ let af = document.getElementById('abonoFecha'); if(af) af.valueAsDate = new Date(); renderClientesDeuda(); cliA = null; }
        function regAbono(){ if(!cliA) return alert("Selecciona cliente"); let m = parseFloat(document.getElementById('abonoMonto')?.value), met = document.getElementById('abonoMetodo')?.value, f = document.getElementById('abonoFecha')?.value; if(!m) return alert("Monto"); let c = DB.clientes.find(x=>x.id===cliA.id); let tv = DB.ventasCredito.filter(v=>v.clienteId===cliA.id&&!v.anulado).reduce((s,v)=>s+v.total,0), ta = DB.abonos.filter(a=>a.clienteId===cliA.id).reduce((s,a)=>s+a.monto,0); let da = Math.max(0,tv-ta), nd = Math.max(0,da-m); mostrarModal('Confirmar Abono', c.nombre + '<br>S/ ' + m.toFixed(2) + '<br>Deuda anterior: S/ ' + da.toFixed(2) + '<br>Nueva: S/ ' + nd.toFixed(2), () => { DB.abonos.push({ id: 'AB_'+Date.now(), clienteId: cliA.id, monto: m, metodo: met, fecha: f||new Date().toISOString().split('T')[0] }); guardarStorage(); document.getElementById('abonoMonto').value = ''; initClientes(); mostrarTicketAbono({ cliente: c.nombre, monto: m, metodo: met, deudaAnterior: da, nuevaDeuda: nd, saldoPendiente: nd }); }); }
        function renderClientesDeuda(){ let div = document.getElementById('listaClientesDeuda'); if(!div) return; div.innerHTML = DB.clientes.map(c=>{ let tv = DB.ventasCredito.filter(v=>v.clienteId===c.id&&!v.anulado).reduce((s,v)=>s+v.total,0), ta = DB.abonos.filter(a=>a.clienteId===c.id).reduce((s,a)=>s+a.monto,0), s = tv - ta; return '<div style="display:flex;justify-content:space-between;padding:10px;background:#f7fafc;margin-bottom:6px;"><div><b>' + c.nombre + '</b></div><div style="font-weight:700;color:' + (s>0?'#e53e3c':'#38a169') + '">S/ ' + s.toFixed(2) + '</div><button class="btn btn-danger btn-xs" onclick="eliminarCliente(\'' + c.id + '\')">❌</button></div>'; }).join(''); }
        function nuevoCliente(){ document.getElementById('modalContainer').innerHTML = '<div class="modal-overlay" id="mo"><div class="modal"><h3>➕ Nuevo Cliente</h3><input type="text" id="ncNom" placeholder="Nombre"><input type="text" id="ncTel" placeholder="Telefono"><div class="modal-actions"><button class="btn btn-accent" onclick="cerrarModal()">Cancelar</button><button class="btn btn-primary" id="ncBtn">Crear</button></div></div></div>'; document.getElementById('mo').onclick = function(e){ if(e.target===this) cerrarModal(); }; document.getElementById('ncBtn').onclick = function(){ let n = document.getElementById('ncNom')?.value.trim(); if(!n) return; let id = 'CLI_'+Date.now(); DB.clientes.push({ id, nombre: n, telefono: document.getElementById('ncTel')?.value||'' }); guardarStorage(); cerrarModal(); initClientes(); }; }
        function eliminarCliente(id){ mostrarModal('Eliminar', '¿Eliminar?', () => { DB.clientes = DB.clientes.filter(x=>x.id!==id); DB.ventasCredito = DB.ventasCredito.filter(v=>v.clienteId!==id); DB.abonos = DB.abonos.filter(a=>a.clienteId!==id); guardarStorage(); initClientes(); }); }
        
        // ============ COMPRAS ============
        function vCompras(){ return '<div class="topbar"><h2>🛒 Compras</h2></div><div class="grid-2"><div class="card"><div class="card-header">📊 Pedidos Proyectados</div><div id="pedidoIng"></div><div style="background:#1a202c;padding:10px;border-radius:6px;"><h4 style="color:#fbd38d;">🏭 Nucleos</h4><div id="pedidoNuc"></div></div></div><div class="card"><div class="card-header">🛍️ Compra Rapida</div><select id="compraInsumo">' + INSUMOS.map(i=>'<option>' + i + '</option>').join('') + '</select><div class="form-row"><input type="number" id="compraKilos" placeholder="Kilos"><input type="number" id="compraCosto" placeholder="Costo S/"></div><button class="btn btn-accent" onclick="agregarCarrito()">➕ Añadir</button><table><thead><tr><th>Insumo</th><th>Kg</th><th>S/</th><th></th></tr></thead><tbody id="cuerpoCarrito"></tbody></table><button id="btnProcesar" class="btn btn-primary" style="display:none;" onclick="envCarrito()">Guardar</button></div></div>'; }
        function initCompras(){ actualizarPedidos(); actualizarCarrito(); }
        function actualizarPedidos(){ let ing = document.getElementById('pedidoIng'), nuc = document.getElementById('pedidoNuc'); if(!DB.lotes.length){ if(ing) ing.innerHTML = '<p>Sin lotes</p>'; return; } let kpf={}; DB.lotes.forEach(l=>{ let sa=semF(l.fechaLlegada), cs=cSemanal(l.especie,sa); if(cs>0){ let f=getFormula(l.especie,sa); kpf[f] = (kpf[f]||0) + l.cantidad*cs; } }); let ingS={}; for(let f in kpf) for(let i in RECETAS[f]){ let c=(RECETAS[f][i]/500)*kpf[f]; if(LISTA_NUCLEOS.includes(i)){ if(nuc) nuc.innerHTML = '<p>Nucleos: ' + c.toFixed(2) + ' kg</p>'; } else ingS[i]=(ingS[i]||0)+c; } let h=''; for(let i in ingS){ let it=DB.stock.find(x=>x.nombre===i); let st=it?parseFloat(it.cantidad)||0:0; let falta=Math.max(0,ingS[i]-st); h+='<div>' + i + ': ' + falta.toFixed(2) + ' kg (stock: ' + st.toFixed(2) + ')</div>'; } if(ing) ing.innerHTML = h || '<p>Stock suficiente</p>'; }
        let carrito = []; function agregarCarrito(){ let i = document.getElementById('compraInsumo')?.value, k = parseFloat(document.getElementById('compraKilos')?.value), c = parseFloat(document.getElementById('compraCosto')?.value); if(!k||!c) return; carrito.push({ insumo: i, kilos: k, costo: c }); actualizarCarrito(); }
        function actualizarCarrito(){ let b = document.getElementById('cuerpoCarrito'), bp = document.getElementById('btnProcesar'); if(!b) return; b.innerHTML = carrito.map((x,i)=>'<tr><td>' + x.insumo + '</td><td>' + x.kilos + ' kg</td><td>S/' + x.costo + '</td><td><button onclick="carrito.splice(' + i + ',1); actualizarCarrito();">❌</button></td></tr>').join(''); if(bp) bp.style.display = carrito.length ? 'block' : 'none'; }
        function envCarrito(){ if(!carrito.length) return; mostrarModal('Confirmar Compra', 'Guardar ' + carrito.length + ' items?', () => { carrito.forEach(item=>{ let e = DB.stock.find(s=>s.nombre === item.insumo); if(e) e.cantidad += item.kilos; else DB.stock.push({ nombre: item.insumo, cantidad: item.kilos }); DB.gastos.unshift({ fecha: new Date().toISOString().split('T')[0], concepto: '🛒 Compra: ' + item.insumo, monto: item.costo }); }); guardarStorage(); carrito = []; actualizarCarrito(); actualizarPedidos(); sincronizar(); mostrarMensaje('Compra guardada'); }); }
        
        // ============ PREPARAR ============
        function vPreparar(){ return '<div class="topbar"><h2>🥣 Mezcladora</h2></div><div class="card"><select id="prepFormula"><option value="">-- Formula --</option>' + Object.keys(RECETAS).map(f=>'<option>' + f + '</option>').join('') + '</select><input type="number" id="prepKilos" placeholder="Kilos a preparar" oninput="mostrarReceta()"><input type="date" id="prepFecha"><div id="cajaReceta" style="display:none;"><ul id="listaReceta"></ul></div><button class="btn btn-primary" onclick="regPreparar()">🥣 Preparar</button></div>'; }
        function mostrarReceta(){ let f = document.getElementById('prepFormula')?.value, k = parseFloat(document.getElementById('prepKilos')?.value), c = document.getElementById('cajaReceta'), l = document.getElementById('listaReceta'); if(!f||!k){ if(c) c.style.display='none'; return; } if(c) c.style.display='block'; if(l) l.innerHTML = Object.entries(RECETAS[f]).map(([ing,v])=>'<li><b>' + ((v/500)*k).toFixed(2) + ' kg</b> - ' + ing + '</li>').join(''); }
        function regPreparar(){ let f = document.getElementById('prepFormula')?.value, k = parseFloat(document.getElementById('prepKilos')?.value), fecha = document.getElementById('prepFecha')?.value || new Date().toISOString().split('T')[0]; if(!f||!k) return; mostrarModal('Confirmar', f + ': ' + k + ' kg', () => { let receta = RECETAS[f]; for(let ing in receta){ let cant = -((receta[ing]/500)*k); let item = DB.stock.find(s=>s.nombre === ing); if(item) item.cantidad += cant; else DB.stock.push({ nombre: ing, cantidad: cant }); } let ak = "🥣 " + f; let ae = DB.stock.find(s=>s.nombre === ak); if(ae) ae.cantidad += k; else DB.stock.push({ nombre: ak, cantidad: k }); guardarStorage(); sincronizar(); mostrarMensaje(k + ' kg de ' + f + ' preparados'); }); }
        
        // ============ GASTOS ============
        function vGastos(){ return '<div class="topbar"><h2>💸 Gastos</h2></div><div class="grid-2"><div class="card"><select id="gastoConcepto"><option>Vacuna</option><option>Medicina</option><option>Jornal</option><option>Otros</option></select><input type="text" id="gastoDetalle" placeholder="Detalle"><input type="number" id="gastoMonto" placeholder="Monto S/"><input type="date" id="gastoFecha"><button class="btn btn-primary" onclick="regGasto()">Registrar</button></div><div class="card"><div class="card-header">Ultimos</div><div id="listaGastos"></div></div></div>'; }
        function initGastos(){ let gf = document.getElementById('gastoFecha'); if(gf) gf.valueAsDate = new Date(); renderGastos(); }
        function regGasto(){ let c = document.getElementById('gastoConcepto')?.value, d = document.getElementById('gastoDetalle')?.value.trim(), m = parseFloat(document.getElementById('gastoMonto')?.value), f = document.getElementById('gastoFecha')?.value; if(!m) return; let g = { fecha: f||new Date().toISOString().split('T')[0], concepto: d ? c+" - "+d : c, monto: m }; mostrarModal('Confirmar', g.concepto + '<br>S/ ' + m, () => { DB.gastos.unshift(g); guardarStorage(); sincronizar(); }); }
        function renderGastos(){ let div = document.getElementById('listaGastos'); if(!div) return; div.innerHTML = DB.gastos.slice(0,20).map(g=>'<div>' + g.fecha + ' - ' + g.concepto + ': S/ ' + g.monto.toFixed(2) + '</div>').join(''); }
        
        // ============ MORTALIDAD ============
        function vMortalidad(){ return '<div class="topbar"><h2>💀 Mortalidad</h2></div><div class="card"><select id="mortLote"><option value="">-- Lote --</option>' + DB.lotes.map((l,i)=>'<option value="' + i + '">' + l.id + ' (' + l.cantidad + ')</option>').join('') + '</select><input type="number" id="mortCant" placeholder="Cantidad"><select id="mortCausa"><option>Enfermedad</option><option>Accidente</option></select><input type="date" id="mortFecha"><button class="btn btn-danger" onclick="regMortalidad()">Registrar</button></div>'; }
        function initMortalidad(){ let mf = document.getElementById('mortFecha'); if(mf) mf.valueAsDate = new Date(); }
        function regMortalidad(){ let idx = document.getElementById('mortLote')?.value, cant = parseInt(document.getElementById('mortCant')?.value), causa = document.getElementById('mortCausa')?.value, fecha = document.getElementById('mortFecha')?.value; if(idx===""||!cant) return; let l = DB.lotes[idx]; if(cant > l.cantidad) return; mostrarModal('Confirmar', 'Baja de ' + cant + ' ' + l.especie, () => { DB.mortalidad.push({ id: 'MORT_'+Date.now(), loteId: l.id, cantidad: cant, causa: causa, fecha: fecha||new Date().toISOString().split('T')[0] }); l.cantidad -= cant; if(l.cantidad<=0) DB.lotes.splice(idx,1); guardarStorage(); sincronizar(); }); }
        
        // ============ NEVERA ============
        function vNevera(){ let nevera = DB.carneStock || []; let totalKg = nevera.reduce((s,c)=>s+c.kg,0); let h = '<div class="kpi-row"><div class="kpi-card kpi-blue"><div class="kpi-val">' + nevera.length + '</div><div class="kpi-lbl">Piezas</div></div><div class="kpi-card kpi-blue"><div class="kpi-val">' + totalKg.toFixed(1) + ' kg</div><div class="kpi-lbl">Total</div></div></div>'; nevera.forEach((c,i)=>{ h += '<div class="card"><div><b>' + c.especie + '</b> - ' + c.kg.toFixed(2) + ' kg (' + (c.lote||'sin lote') + ')</div><button class="btn btn-danger btn-xs" onclick="devolverNevera(' + i + ')">↩️ Devolver</button></div>'; }); return '<div class="topbar"><h2>🥩 Nevera</h2></div>' + h; }
        function devolverNevera(idx){ let item = DB.carneStock[idx]; if(!item) return; mostrarModal('Devolver', 'Devolver ' + item.kg.toFixed(2) + ' kg?', () => { let lote = DB.lotes.find(l=>l.id===item.lote); if(lote) lote.cantidad += 1; else DB.lotes.push({ id: item.lote, especie: 'Cerdos', cantidad: 1, fechaLlegada: new Date().toISOString().split('T')[0] }); DB.carneStock.splice(idx,1); guardarStorage(); sincronizar(); }); }
        
        // ============ TICKETS ============
        function vTickets(){ return '<div class="topbar"><h2>🧾 Tickets</h2></div><div class="card"><div class="filter-row"><input type="text" id="tktBuscar" placeholder="Buscar..." oninput="renderTickets()"><input type="date" id="tktDesde" onchange="renderTickets()"><input type="date" id="tktHasta" onchange="renderTickets()"></div><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Total</th><th>Tipo</th><th></th></thead><tbody id="tktTabla"></tbody></table></div>'; }
        function initTickets(){ let th = document.getElementById('tktHasta'); if(th) th.valueAsDate = new Date(); renderTickets(); }
        function renderTickets(){ let todas = [...DB.ventasContado.map(v=>({...v, tipo:'contado'})), ...DB.ventasCredito.map(v=>({...v, tipo:'credito'})), ...DB.abonos.map(a=>({id:a.id, fecha:a.fecha, clienteId:a.clienteId, total:a.monto, tipo:'abono'}))]; let tb = document.getElementById('tktTabla'); if(tb) tb.innerHTML = todas.slice(0,50).map(v=>{ let c = DB.clientes.find(x=>x.id===v.clienteId); return '<tr><td>' + v.fecha + '</td><td>' + (c?c.nombre:'?') + '</td><td>S/ ' + v.total.toFixed(2) + '</td><td>' + v.tipo + '</td><td><button class="btn btn-accent btn-xs" onclick="verTicket(\'' + v.id + '\',\'' + v.tipo + '\')">🧾</button></td></tr>'; }).join(''); }
        function verTicket(id, tipo){ if(tipo==='abono'){ let a = DB.abonos.find(x=>x.id===id); if(a){ let c = DB.clientes.find(x=>x.id===a.clienteId); if(c) mostrarTicketAbono({ cliente: c.nombre, monto: a.monto, metodo: a.metodo||'Efectivo', deudaAnterior: 0, nuevaDeuda: 0, saldoPendiente: 0 }); } } else { let v = tipo==='contado'?DB.ventasContado.find(x=>x.id===id):DB.ventasCredito.find(x=>x.id===id); if(v){ let c = DB.clientes.find(x=>x.id===v.clienteId); mostrarTicket(tipo, { cliente: c?c.nombre:'?', especie: v.especie, cantidad: v.kg, kg: v.kg, precio: v.precio, total: v.total.toFixed(2) }); } } }
        
        document.addEventListener('click', function(e){ let dv = document.getElementById('dropdownClientesV'), da = document.getElementById('dropdownClientesA'); if(dv && !dv.contains(e.target) && !document.getElementById('buscarClienteV')?.contains(e.target)) dv.classList.remove('show'); if(da && !da.contains(e.target) && !document.getElementById('buscarClienteA')?.contains(e.target)) da.classList.remove('show'); });
    </script>
</body>
</html>
