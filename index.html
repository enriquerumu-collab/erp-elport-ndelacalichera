<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzgb21ruwDt26pj5utoBifr0Bp_5fFW6Vtmnmpnkzvr0lwa87PI9lzODVnApBpnbjf1Hw/exec';

let DB = {
    lotes: [], curva: [], protocolos: [], stock: [],
    gastos: [], clientes: [], proveedores: [],
    ventasCredito: [], ventasContado: [],
    abonos: [], mortalidad: [], carneStock: [],
    recetas: {}
};

let PENDIENTES = [];
let carritoCompras = [];

const RECETAS_DEFAULT = {
    "Pato Inicio":{"Maiz":278,"Torta de Soya 45":170,"Harina Integral Soya":23,"Afrecho":10.5,"Carbonato de Calcio":6,"Sal":1.5,"Fungiban 50%":0.5,"Cloruro de Colina":0.5,"Nucleo Pato Inicio":10},
    "Pato Crecimiento":{"Maiz":309.5,"Torta de Soya 45":157,"Harina Integral Soya":12,"Aceite Vegetal":4,"Carbonato de Calcio":5.2,"Sal":1.3,"Fungiban 50%":0.5,"Cloruro de Colina":0.5,"Nucleo Pato Crecimiento":10},
    "Pato Acabado":{"Maiz":323.5,"Torta de Soya 45":137,"Harina Integral Soya":17.5,"Aceite Vegetal":5,"Carbonato de Calcio":4.7,"Sal":1.3,"Fungiban 50%":0.5,"Cloruro de Colina":0.5,"Nucleo Pato Acabado":10},
    "Cerdo Inicio":{"Maiz":282.5,"Torta de Soya 45":193.5,"Aceite Vegetal":8.5,"Carbonato de Calcio":4.4,"Sal":1.6,"Fungiban 50%":0.5,"Cloruro de Colina":0.5,"Nucleo Cerdo Inicio":8.5},
    "Cerdo Crecimiento":{"Maiz":342.2,"Torta de Soya 45":135,"Aceite Vegetal":6.5,"Carbonato de Calcio":4.5,"Sal":1.8,"Fungiban 50%":0.5,"Cloruro de Colina":0.5,"Nucleo Cerdo Crecimiento":9},
    "Cerdo Desarrollo":{"Maiz":359,"Torta de Soya 45":123,"Aceite Vegetal":5,"Carbonato de Calcio":4.1,"Sal":1.9,"Fungiban 50%":0.5,"Cloruro de Colina":0.5,"Nucleo Cerdo Desarrollo":6},
    "Cerdo Acabado":{"Maiz":363.6,"Torta de Soya 45":118,"Aceite Vegetal":3.5,"Carbonato de Calcio":3.9,"Sal":2.0,"Fungiban 50%":0.5,"Cloruro de Colina":0.5,"Nucleo Cerdo Acabado":8}
};

const INSUMOS = ["Corimicyn","Maiz","Torta de Soya 45","Harina Integral Soya","Afrecho","Aceite Vegetal","Carbonato de Calcio","Sal","Fungiban 50%","Cloruro de Colina","Nucleo Pato Inicio","Nucleo Pato Crecimiento","Nucleo Pato Acabado","Nucleo Cerdo Inicio","Nucleo Cerdo Crecimiento","Nucleo Cerdo Desarrollo","Nucleo Cerdo Acabado"];
const INSUMOS_MOLINO = ["Maiz","Torta de Soya 45","Harina Integral Soya","Afrecho","Aceite Vegetal","Carbonato de Calcio","Sal"];
const NUCLEOS = ["Nucleo Pato Inicio","Nucleo Pato Crecimiento","Nucleo Pato Acabado","Nucleo Cerdo Inicio","Nucleo Cerdo Crecimiento","Nucleo Cerdo Desarrollo","Nucleo Cerdo Acabado"];
const NUCLEOS_KG = {"Nucleo Pato Inicio":10,"Nucleo Pato Crecimiento":10,"Nucleo Pato Acabado":10,"Nucleo Cerdo Inicio":8.5,"Nucleo Cerdo Crecimiento":9,"Nucleo Cerdo Desarrollo":6,"Nucleo Cerdo Acabado":8};

const NUCLEOS_PATO = ["Nucleo Pato Inicio","Nucleo Pato Crecimiento","Nucleo Pato Acabado"];
const NUCLEOS_CERDO = ["Nucleo Cerdo Inicio","Nucleo Cerdo Crecimiento","Nucleo Cerdo Desarrollo","Nucleo Cerdo Acabado"];

let vistaActual = 'dashboard';

function normalizarFecha(valor) {
    if (!valor) return '';
    const s = String(valor).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)) {
        const p = s.split('/');
        return p[2] + '-' + p[1].padStart(2,'0') + '-' + p[0].padStart(2,'0');
    }
    if (/^\d{4}-\d{2}-\d{2}T/.test(s)) return s.split('T')[0];
    const mesesEn = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',
                     Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
    const matchLargo = s.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{1,2})\s+(\d{4})\b/);
    if (matchLargo) {
        const mes = mesesEn[matchLargo[1]];
        const dia = matchLargo[2].padStart(2,'0');
        const anio = matchLargo[3];
        return `${anio}-${mes}-${dia}`;
    }
    if (/^\d+(\.\d+)?$/.test(s)) {
        const n = parseFloat(s);
        if (n > 40000 && n < 60000) {
            const d = new Date(Date.UTC(1899,11,30) + n * 86400000);
            return d.toISOString().split('T')[0];
        }
    }
    return s;
}

function normalizarFechasDB() {
    DB.lotes = DB.lotes.map(l => ({...l, fechaLlegada: normalizarFecha(l.fechaLlegada)}));
    DB.gastos = DB.gastos.map(g => ({...g, fecha: normalizarFecha(g.fecha)}));
    DB.ventasCredito = DB.ventasCredito.map(v => ({...v, fecha: normalizarFecha(v.fecha)}));
    DB.ventasContado = DB.ventasContado.map(v => ({...v, fecha: normalizarFecha(v.fecha)}));
    DB.abonos = DB.abonos.map(a => ({...a, fecha: normalizarFecha(a.fecha)}));
    DB.mortalidad = DB.mortalidad.map(m => ({...m, fecha: normalizarFecha(m.fecha)}));
    DB.carneStock = (DB.carneStock||[]).map(c => ({...c, fecha: normalizarFecha(c.fecha)}));
}

function hoy() { return new Date().toISOString().split('T')[0]; }

function semF(f) {
    const fn = normalizarFecha(f);
    if (!fn) return 1;
    const dias = Math.floor((new Date() - new Date(fn + 'T00:00:00')) / 86400000);
    const s = Math.floor(dias / 7) + 1;
    return s < 1 ? 1 : s;
}
function diaF(f) {
    const fn = normalizarFecha(f);
    if (!fn) return 1;
    return Math.floor((new Date() - new Date(fn + 'T00:00:00')) / 86400000) + 1;
}

function getRecetas() { return Object.keys(DB.recetas).length > 0 ? DB.recetas : RECETAS_DEFAULT; }

function getFormula(especie, sem) {
    const esp = (especie||'').toLowerCase();
    if (esp.includes('pato')) {
        if (sem === 1) return 'Corimicyn';
        if (sem <= 3) return 'Pato Inicio';
        if (sem <= 7) return 'Pato Crecimiento';
        return 'Pato Acabado';
    }
    if (sem <= 4) return 'Cerdo Inicio';
    if (sem <= 7) return 'Cerdo Crecimiento';
    if (sem <= 10) return 'Cerdo Desarrollo';
    return 'Cerdo Acabado';
}

function cDiario(lote) {
    const sem = semF(lote.fechaLlegada);
    const curva = DB.curva.find(x => x.semana == sem);
    if (!curva) return 0;
    const esp = (lote.especie||'').toLowerCase();
    const sexo = lote.sexo || '';
    if (esp.includes('pato')) {
        if (sexo === 'M') return (curva.patoMacho || 0) / 7;
        if (sexo === 'H') return (curva.patoHembra || 0) / 7;
        return ((curva.patoMacho || 0) + (curva.patoHembra || 0)) / 2 / 7;
    }
    return (curva.cerdo || 0) / 7;
}

function cDiarioTotal(lote) { return lote.cantidad * cDiario(lote); }

function getStock(nombre) {
    let s = DB.stock.find(x => x.nombre === nombre);
    if (s) return Math.max(0, parseFloat(s.cantidad)||0);
    s = DB.stock.find(x => x.nombre === ('🥣 ' + nombre));
    if (s) return Math.max(0, parseFloat(s.cantidad)||0);
    const sinEmoji = nombre.replace('🥣 ','');
    s = DB.stock.find(x => x.nombre === sinEmoji);
    if (s) return Math.max(0, parseFloat(s.cantidad)||0);
    return 0;
}

function sugerirNombreLote(especie) {
    const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    const mes = meses[new Date().getMonth()];
    const tipo = (especie||'').includes('Pato') ? 'Patos' : 'Cerdos';
    let nombre = tipo + ' ' + mes;
    let contador = 2;
    while (DB.lotes.find(l => l.id === nombre)) { nombre = tipo + ' ' + mes + ' ' + contador; contador++; }
    return nombre;
}

function hayPatos() { return DB.lotes.some(l => (l.especie||'').toLowerCase().includes('pato')); }
function hayCerdos() { return DB.lotes.some(l => (l.especie||'').toLowerCase().includes('cerdo')); }

function mostrarMensaje(texto, tipo='ok') {
    document.querySelectorAll('.mensaje-flotante').forEach(e => e.remove());
    let msg = document.createElement('div');
    msg.className = 'mensaje-flotante' + (tipo==='error'?' mensaje-error':tipo==='info'?' mensaje-info':'');
    msg.textContent = texto;
    document.body.appendChild(msg);
    setTimeout(() => msg.remove(), 4000);
}

// ============ SINCRONIZACION ============
async function sincronizar() {
    const btn = document.getElementById('btnSync');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Sincronizando...'; }
    mostrarMensaje('⏳ Guardando en Google Sheets...', 'info');

    let errores = 0;
    for (const op of PENDIENTES) {
        try {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(op) });
            const data = await res.json();
            if (!data.success) { console.error('Error guardando:', op, data.error); errores++; }
        } catch(e) { console.error('Error de red:', e); errores++; }
    }
    PENDIENTES = [];

    mostrarMensaje('📁 Cargando datos del Sheet...', 'info');
    try {
        const res = await fetch(API_URL + '?action=cargar');
        const data = await res.json();
        if (data.success && data.datos) {
            const d = data.datos;
            if (d.lotes && d.lotes.length) {
                DB.lotes = d.lotes.map(l => ({ ...l, fechaLlegada: normalizarFecha(l.fechaLlegada) }));
            }
            if (d.protocolos && d.protocolos.length) DB.protocolos = d.protocolos;
            if (d.curva && d.curva.length) DB.curva = d.curva;
            if (d.stock && d.stock.length) {
                // Stock viene directo de columna G->J del sheet (SUMIF ya calculado)
                DB.stock = d.stock.map(s => ({...s, nombre: (s.nombre||'').replace('🥣 ','')}));
            }
            if (d.gastos) DB.gastos = d.gastos.map(g => ({ ...g, fecha: normalizarFecha(g.fecha) }));
            if (d.clientes) DB.clientes = d.clientes;
            if (d.proveedores) DB.proveedores = d.proveedores || [];
            if (d.ventasCredito) DB.ventasCredito = d.ventasCredito.map(v => ({ ...v, fecha: normalizarFecha(v.fecha) }));
            if (d.ventasContado) DB.ventasContado = d.ventasContado.map(v => ({ ...v, fecha: normalizarFecha(v.fecha) }));
            if (d.abonos) DB.abonos = d.abonos.map(a => ({ ...a, fecha: normalizarFecha(a.fecha) }));
            if (d.mortalidad) DB.mortalidad = d.mortalidad.map(m => ({ ...m, fecha: normalizarFecha(m.fecha) }));
            if (d.carneStock) DB.carneStock = d.carneStock.map(c => ({ ...c, fecha: normalizarFecha(c.fecha) }));
            if (d.recetas && Object.keys(d.recetas).length) DB.recetas = d.recetas;

            guardarLocal();
            renderizar(vistaActual);
            mostrarMensaje(errores > 0 ? '⚠️ Sync con ' + errores + ' errores' : '✅ Sincronización completada');
        } else {
            mostrarMensaje('❌ Error al cargar: ' + (data.error || 'desconocido'), 'error');
        }
    } catch(e) {
        mostrarMensaje('❌ Error de conexión: ' + e.message, 'error');
    }

    if (btn) { btn.disabled = false; btn.textContent = '🔄 Sincronizar'; }
}

async function enviarAlSheet(accion, datos) {
    try {
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ accion, datos }) });
        return await res.json();
    } catch(e) { return { success: false, error: e.message }; }
}

function guardarLocal() {
    try { localStorage.setItem('erp_v6_db', JSON.stringify(DB)); } catch(e) {}
}
function cargarLocal() {
    try {
        const saved = localStorage.getItem('erp_v6_db');
        if (saved) {
            Object.assign(DB, JSON.parse(saved));
            normalizarFechasDB();
            return true;
        }
    } catch(e) {}
    return false;
}

function calcProyeccionLote(lote) {
    // Devuelve array de semanas con datos de consumo
    const fechaLlegada = new Date(lote.fechaLlegada + 'T00:00:00');
    const semanas = [];
    const TOTAL_SEMS = 12;

    for (let s = 1; s <= TOTAL_SEMS; s++) {
        const diaIni = (s-1)*7;
        const diaFin = s*7-1;
        const fechaIni = new Date(fechaLlegada.getTime() + diaIni*86400000);
        const fechaFin = new Date(fechaLlegada.getTime() + diaFin*86400000);
        const formula = getFormula(lote.especie, s);
        const curvaS = DB.curva.find(c => c.semana == s) || DB.curva[DB.curva.length-1];
        if (!curvaS) continue;

        const sexo = lote.sexo || '';
        let kgDiaPorAnimal;
        if (sexo === 'M') kgDiaPorAnimal = curvaS.patoMacho / 7;
        else if (sexo === 'H') kgDiaPorAnimal = curvaS.patoHembra / 7;
        else kgDiaPorAnimal = (curvaS.patoMacho + curvaS.patoHembra) / 2 / 7;

        const kgDia = lote.cantidad * kgDiaPorAnimal;
        const kgSem = kgDia * 7;

        const hoyDate = new Date(hoy() + 'T00:00:00');
        let estado;
        if (fechaFin < hoyDate) estado = 'pasada';
        else if (fechaIni <= hoyDate) estado = 'en_curso';
        else estado = 'proxima';

        semanas.push({
            sem: s,
            fechaIni: fechaIni.toISOString().split('T')[0],
            fechaFin: fechaFin.toISOString().split('T')[0],
            formula,
            kgDia: parseFloat(kgDia.toFixed(2)),
            kgSem: parseFloat(kgSem.toFixed(2)),
            estado,
            cantidad: lote.cantidad
        });
    }
    return semanas;
}

}

            const key = s.fechaIni;

            mapaFechas[key].lotes[l.id] = s;
            mapaFechas[key].totalDia += s.kgDia;
            mapaFechas[key].totalSem += s.kgSem;

    const semanas = Object.values(mapaFechas).sort((a,b) => a.fechaIni.localeCompare(b.fechaIni));

        const rowBg = esCurso ? 'background:#f0fff4;' : esPasada ? 'opacity:0.5;' : '';

        html += `<tr style="border-bottom:1px solid #e2e8f0;${rowBg}">

function renderPlanGrafico(cont, lotes) {
    cont.innerHTML = `<div class="card"><div class="card-header">📉 Consumo semanal por lote</div>
        <div class="chart-container" style="height:380px"><canvas id="chartPlan"></canvas></div>
    </div>`;

    setTimeout(() => {
        const ctx = document.getElementById('chartPlan');
        if (!ctx) return;

        // Construir semanas únicas
        const todasSems = [];
        const mapaFechas = {};
        lotes.forEach(l => {
            calcProyeccionLote(l).forEach(s => {
                if (!mapaFechas[s.fechaIni]) {
                    mapaFechas[s.fechaIni] = s.fechaIni;
                    todasSems.push(s.fechaIni);
                }
            });
        });
        todasSems.sort();

        const colors = ['#3498db','#9b59b6','#e67e22','#e74c3c','#27ae60','#1abc9c'];
        const datasets = lotes.map((l, i) => {
            const semsLote = calcProyeccionLote(l);
            const data = todasSems.map(fecha => {
                const s = semsLote.find(x => x.fechaIni === fecha);
                return s ? s.kgSem : 0;
            });
            return {
                label: l.id + ' (' + l.cantidad + ')',
                data,
                backgroundColor: colors[i % colors.length] + '99',
                borderColor: colors[i % colors.length],
                borderWidth: 2,
                borderRadius: 4
            };
        });

        // Línea de total
        const totales = todasSems.map(fecha => {
            return lotes.reduce((sum, l) => {
                const s = calcProyeccionLote(l).find(x => x.fechaIni === fecha);
                return sum + (s ? s.kgSem : 0);
            }, 0);
        });
        datasets.push({
            label: 'Total',
            data: totales,
            type: 'line',
            borderColor: '#2d3748',
            backgroundColor: 'transparent',
            borderWidth: 2,
            borderDash: [5,5],
            pointRadius: 4,
            tension: 0.3
        });

        // Labels cortos: "S1 09/05"
        const labels = todasSems.map((f, i) => 'S'+(i+1)+' '+f.substring(5));

        new Chart(ctx, {
            type: 'bar',
            data: { labels, datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
                    tooltip: { callbacks: { label: c => c.dataset.label + ': ' + c.parsed.y.toFixed(0) + ' kg/sem' } }
                },
                scales: {
                    x: { stacked: true, ticks: { font: { size: 10 } } },
                    y: { stacked: false, ticks: { callback: v => v + ' kg' } }
                }
            }
        });
    }, 100);
}

        const esP = (l.especie||'').toLowerCase().includes('pato');
        const sexoLabel = l.sexo === 'M' ? ' ♂' : l.sexo === 'H' ? ' ♀' : '';
        lotesHTML += `<div class="lote-card ${esP?'pato':'cerdo'}">
            <h4>${esP?'🦆':'🐷'} ${l.id}${sexoLabel} — ${l.cantidad} animales</h4>
            <div class="lote-meta">Día ${dia} | Semana ${sem} | ${formula}</div>
            <div class="lote-consumo">🌽 <b>${cd.toFixed(2)} kg/día</b> | 📦 ${(cd*7).toFixed(2)} kg/semana</div>
        </div>`;
    });
    futuros.forEach(l => {
        const esP = (l.especie||'').toLowerCase().includes('pato');
        const dias = diasParaLlegada(l.fechaLlegada);
        lotesHTML += `<div class="lote-card" style="border-left-color:#9b59b6;opacity:0.8">
            <h4>${esP?'🦆':'🐷'} ${l.id} — ${l.cantidad} animales</h4>
            <div class="lote-meta" style="color:#9b59b6">📅 Llega en ${dias} día(s) — ${l.fechaLlegada}</div>
            <div class="lote-consumo" style="color:#718096">Aún no activo</div>
        </div>`;
    });
    if (!lotesHTML) lotesHTML = '<p style="color:#718096">Sin lotes. Sincroniza.</p>';

    const consumoPorFormula = {};
    activos.forEach(l => {
        const f = getFormula(l.especie, semF(l.fechaLlegada));
        consumoPorFormula[f] = (consumoPorFormula[f]||0) + cDiarioTotal(l);
    });

    let diasAlimentoHTML = '';
    for (const f in consumoPorFormula) {
        const cdF = consumoPorFormula[f];
        const stockF = getStock(f);
        const dias = cdF > 0 ? Math.floor(stockF / cdF) : 99;
        const icono = dias <= 0 ? '🔴' : dias <= 3 ? '🟡' : '🟢';
        diasAlimentoHTML += `<div class="stock-item">
            <div><b>${f}</b><br><small>${stockF.toFixed(1)} kg disponibles</small></div>
            <div style="text-align:right">${icono} <b>${dias >= 99 ? '∞' : dias} días</b></div>
        </div>`;
    }
    if (!diasAlimentoHTML) diasAlimentoHTML = '<p style="color:#718096">Sin datos</p>';

    let tareasHoy = '', tareasPronto = '';
    activos.forEach(l => {
        const dia = diaF(l.fechaLlegada);
        const esP = (l.especie||'').toLowerCase().includes('pato');
        const tipoEsp = esP ? 'pato' : 'cerdo';
        DB.protocolos.forEach(p => {
            const ep = (p.especie||'').toLowerCase();
            if (ep.includes(tipoEsp) && dia >= p.diaInicio && dia <= p.diaFin) {
                tareasHoy += `<div class="tarea-item tarea-hoy">
                    <div class="tarea-badge" style="background:#e74c3c">HOY</div>
                    <div><b>${l.id}:</b> ${p.tarea}<br><small>Día ${dia} (rango ${p.diaInicio}-${p.diaFin})</small></div>
                </div>`;
            }
            if (dia < p.diaInicio && p.diaInicio - dia <= 5 && ep.includes(tipoEsp)) {
                tareasPronto += `<div class="tarea-item tarea-prox">
                    <div class="tarea-badge" style="background:#3498db">+${p.diaInicio-dia}d</div>
                    <div><b>${l.id}:</b> ${p.tarea}</div>
                </div>`;
            }
        });
    });
    if (!tareasHoy) tareasHoy = '<div class="alerta-ok alerta-item">✅ Sin tareas para hoy</div>';

    let alertasHTML = '';
    DB.stock.forEach(s => {
        const c = parseFloat(s.cantidad)||0;
        const nom = s.nombre||'';
        if (nom.startsWith('🥣')) return;
        if (NUCLEOS_CERDO.some(n => nom.includes(n.replace('Nucleo ','').replace('Núcleo ',''))) && !hayCerdos()) return;
        if (NUCLEOS_CERDO.includes(nom) && !hayCerdos()) return;
        if (NUCLEOS_PATO.includes(nom) && !hayPatos()) return;
        // No alertar fórmulas de alimento que el lote aún no usa
        const FORMULAS_ALIMENTO = ['Pato Inicio','Pato Crecimiento','Pato Acabado','Cerdo Inicio','Cerdo Crecimiento','Cerdo Desarrollo','Cerdo Acabado','Corimicyn'];
        const formulasActivas = new Set(lotesActivos().map(l => getFormula(l.especie, semF(l.fechaLlegada))));
        if (FORMULAS_ALIMENTO.includes(nom) && !formulasActivas.has(nom)) return;
        if (c <= 0) {
            alertasHTML += `<div class="alerta-item alerta-critica">🔴 <b>${nom}</b> AGOTADO</div>`;
        } else if (c < 10) {
            alertasHTML += `<div class="alerta-item alerta-warning">🟡 <b>${nom}:</b> ${c.toFixed(2)} kg</div>`;
        }
    });
    if (!alertasHTML) alertasHTML = '<div class="alerta-ok alerta-item">✅ Stock suficiente</div>';

    return `${topbarHTML('📊 Inicio')}
    <div class="kpi-row">
        <div class="kpi-card kpi-green"><div class="kpi-val">${totalAnimales}</div><div class="kpi-lbl">🐾 Animales activos</div></div>
        <div class="kpi-card kpi-green"><div class="kpi-val">${consumoDiarioTotal.toFixed(2)} kg</div><div class="kpi-lbl">🌽 Comida/día total</div></div>
        <div class="kpi-card kpi-red"><div class="kpi-val">S/ ${deudaTotal.toFixed(0)}</div><div class="kpi-lbl">💰 Por cobrar</div></div>
        <div class="kpi-card kpi-blue"><div class="kpi-val">${carneKg.toFixed(1)} kg</div><div class="kpi-lbl">🥩 Nevera</div></div>
    </div>
    <div class="grid-2">
        <div class="card"><div class="card-header">🦆 Lotes activos y consumo</div>${lotesHTML}</div>
        <div class="card">
            <div class="card-header">📅 Días de alimento</div>${diasAlimentoHTML}
            <div class="card-header" style="margin-top:16px;">🔔 Alertas de stock</div>${alertasHTML}
        </div>
    </div>
    <div class="grid-2">
        <div class="card"><div class="card-header">📋 Tareas HOY</div>${tareasHoy}${tareasPronto?'<div style="font-weight:700;margin-top:12px;margin-bottom:6px;font-size:13px;color:#718096">PRÓXIMAS (5 días)</div>'+tareasPronto:''}</div>
        <div class="card"><div class="card-header">📊 Stock (gráfico)</div><div class="chart-container" style="height:380px"><canvas id="graficoStock"></canvas></div></div>
    </div>`;
}

function initDashboard() {
    const ctx = document.getElementById('graficoStock');
    if (!ctx) return;
    const FORMULAS = ['Pato Inicio','Pato Crecimiento','Pato Acabado','Cerdo Inicio','Cerdo Crecimiento','Cerdo Desarrollo','Cerdo Acabado','Corimicyn'];
    const labels = [], data = [], colors = [];
    DB.stock.forEach(s => {
        const nombre = (s.nombre||'').replace('🥣 ','');
        const cantidad = parseFloat(s.cantidad)||0;
        if (cantidad <= 0) return;
        const esFormula = FORMULAS.includes(nombre);
        labels.push(nombre.length > 22 ? nombre.substring(0,22)+'…' : nombre);
        data.push(cantidad);
        colors.push(esFormula ? '#9b59b6' : cantidad < 10 ? '#e74c3c' : cantidad < 50 ? '#e67e22' : '#27ae60');
    });
    if (labels.length) {
        new Chart(ctx, {
            type: 'bar',
            data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 4 }] },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: { callbacks: { label: ctx => ' ' + ctx.parsed.x.toFixed(1) + ' kg' } }
                },
                scales: {
                    x: { ticks: { callback: v => v + ' kg' }, grid: { color: '#f0f0f0' } },
                    y: { ticks: { font: { size: 11 } } }
                }
            }
        });
    }
}

function vFinanzas() {
    const hoyStr = hoy();
    const hace30 = new Date(); hace30.setDate(hace30.getDate() - 30);
    const hace30Str = hace30.toISOString().split('T')[0];
    return `${topbarHTML('📈 Finanzas')}
    <div class="tab-bar">
        <div class="tab active" onclick="tabFinanzas('resumen',this)">📊 Resumen</div>
        <div class="tab" onclick="tabFinanzas('gastosvsingresos',this)">📉 Gastos vs Ingresos</div>
        <div class="tab" onclick="tabFinanzas('detalle',this)">📋 Detalle gastos</div>
    </div>
    <div class="card" style="margin-bottom:16px;">
        <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
            <div><label>Desde</label><input type="date" id="finDesde" value="${hace30Str}" onchange="initFinanzas()" style="width:160px;margin:0"></div>
            <div><label>Hasta</label><input type="date" id="finHasta" value="${hoyStr}" onchange="initFinanzas()" style="width:160px;margin:0"></div>
        </div>
    </div>
    <div id="finanzasContent"></div>`;
}

function tabFinanzas(tab, el) {
    document.querySelectorAll('.tab-bar .tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    window._finTab = tab;
    initFinanzas();
}

function initFinanzas() {
    const desde = document.getElementById('finDesde')?.value || hoy().substring(0,7)+'-01';
    const hasta = document.getElementById('finHasta')?.value || hoy();
    const tab = window._finTab || 'resumen';
    const cont = document.getElementById('finanzasContent');
    if (!cont) return;

    const ventas = [...DB.ventasContado, ...DB.ventasCredito].filter(v => v.fecha >= desde && v.fecha <= hasta);
    const gastosF = DB.gastos.filter(g => g.fecha >= desde && g.fecha <= hasta);

    const totalVentasContado = DB.ventasContado.filter(v=>v.fecha>=desde&&v.fecha<=hasta).reduce((s,v)=>s+v.total,0);
    const totalVentasCredito = DB.ventasCredito.filter(v=>v.fecha>=desde&&v.fecha<=hasta).reduce((s,v)=>s+v.total,0);
    const totalVentas = totalVentasContado + totalVentasCredito;
    const totalGastos = gastosF.reduce((s,g)=>s+(parseFloat(g.monto)||0),0);
    const utilidad = totalVentas - totalGastos;
    const gastosInsumos = gastosF.filter(g=>g.concepto&&g.concepto.includes('Compra:')).reduce((s,g)=>s+(parseFloat(g.monto)||0),0);
    const gastosGenerales = totalGastos - gastosInsumos;

    let deudaTotal = 0;
    DB.clientes.forEach(c => {
        const tv = DB.ventasCredito.filter(v=>v.clienteId===c.id).reduce((s,v)=>s+v.total,0);
        const ta = DB.abonos.filter(a=>a.clienteId===c.id).reduce((s,a)=>s+a.monto,0);
        deudaTotal += Math.max(0,tv-ta);
    });

    if (tab === 'resumen') {
        cont.innerHTML = `
        <div class="kpi-row">
            <div class="kpi-card kpi-green"><div class="kpi-val">S/ ${totalVentas.toFixed(2)}</div><div class="kpi-lbl">💰 Total Ventas</div><div class="kpi-sub">${totalVentasContado.toFixed(0)} contado / ${totalVentasCredito.toFixed(0)} crédito</div></div>
            <div class="kpi-card ${utilidad>=0?'kpi-green':'kpi-red'}"><div class="kpi-val">S/ ${utilidad.toFixed(2)}</div><div class="kpi-lbl">📊 Utilidad</div></div>
            <div class="kpi-card kpi-red"><div class="kpi-val">S/ ${totalGastos.toFixed(2)}</div><div class="kpi-lbl">💸 Gastos totales</div><div class="kpi-sub">Insumos: ${gastosInsumos.toFixed(0)} / Generales: ${gastosGenerales.toFixed(0)}</div></div>
            <div class="kpi-card kpi-orange"><div class="kpi-val">S/ ${deudaTotal.toFixed(2)}</div><div class="kpi-lbl">⚠️ Por cobrar</div></div>
        </div>
        <div class="grid-2">
            <div class="card"><div class="card-header">💸 Gastos por categoría</div>
                <div class="stock-item"><span>🛒 Insumos/Compras</span><b>S/ ${gastosInsumos.toFixed(2)}</b></div>
                <div class="stock-item"><span>💊 Gastos generales</span><b>S/ ${gastosGenerales.toFixed(2)}</b></div>
                <div class="stock-item" style="border-top:2px solid #e2e8f0;margin-top:4px"><span><b>Total</b></span><b>S/ ${totalGastos.toFixed(2)}</b></div>
            </div>
            <div class="card"><div class="card-header">📋 Últimas ventas del período</div>
                <table><thead><tr><th>Fecha</th><th>Total</th><th>Tipo</th></tr></thead><tbody>
                ${ventas.slice(0,8).map(v=>`<tr><td>${v.fecha}</td><td>S/ ${v.total.toFixed(2)}</td><td><span class="badge ${v.tipo==='contado'?'badge-green':'badge-orange'}">${v.tipo}</span></td></tr>`).join('') || '<tr><td colspan="3" style="color:#718096">Sin ventas en el período</td></tr>'}
                </tbody></table>
            </div>
        </div>`;
    } else if (tab === 'gastosvsingresos') {
        cont.innerHTML = `<div class="card"><div class="card-header">📉 Gastos vs Ingresos</div><div class="chart-container" style="height:320px"><canvas id="chartFinanzas"></canvas></div></div>`;
        setTimeout(() => {
            const dias = {};
            ventas.forEach(v => {
                const d = (v.fecha||'').substring(0,10);
                if (!d) return;
                if (!dias[d]) dias[d] = {ingresos:0,gastos:0};
                dias[d].ingresos += v.total;
            });
            gastosF.forEach(g => {
                const d = (g.fecha||'').substring(0,10);
                if (!d) return;
                if (!dias[d]) dias[d] = {ingresos:0,gastos:0};
                dias[d].gastos += parseFloat(g.monto)||0;
            });
            const labels = Object.keys(dias).sort();
            const ingresos = labels.map(l => dias[l].ingresos);
            const gastos = labels.map(l => dias[l].gastos);
            let acum = 0;
            const gananciaAcum = labels.map((l,i) => { acum += ingresos[i] - gastos[i]; return acum; });
            const ctx = document.getElementById('chartFinanzas');
            if (ctx && labels.length) {
                new Chart(ctx, {
                    data: {
                        labels,
                        datasets: [
                            { type:'line', label:'Ingresos', data:ingresos, borderColor:'#27ae60', backgroundColor:'rgba(39,174,96,0.08)', fill:true, tension:0.4, pointRadius:4, pointHoverRadius:7 },
                            { type:'line', label:'Gastos', data:gastos, borderColor:'#e74c3c', backgroundColor:'rgba(231,76,60,0.08)', fill:true, tension:0.4, pointRadius:4, pointHoverRadius:7 },
                            { type:'line', label:'Ganancia acumulada', data:gananciaAcum, borderColor:'#3498db', backgroundColor:'transparent', tension:0.4, borderDash:[5,5], pointRadius:3, pointHoverRadius:6 }
                        ]
                    },
                    options: {
                        responsive:true, maintainAspectRatio:false,
                        interaction:{ mode:'index', intersect:false },
                        plugins:{ legend:{position:'bottom'}, tooltip:{ callbacks:{ label: ctx => `${ctx.dataset.label}: S/ ${ctx.parsed.y.toFixed(2)}` } } },
                        scales:{ y:{ ticks:{ callback: v => 'S/ '+v } } }
                    }
                });
            } else if (ctx) {
                ctx.parentElement.innerHTML = '<p style="color:#718096;padding:20px">Sin datos para el período seleccionado</p>';
            }
        }, 100);
    } else {
        cont.innerHTML = `<div class="card"><div class="card-header">📋 Todos los gastos del período (${gastosF.length})</div>
            <table><thead><tr><th>Fecha</th><th>Concepto</th><th>Monto</th></tr></thead><tbody>
            ${gastosF.map(g=>`<tr><td>${g.fecha}</td><td>${g.concepto||''}</td><td style="color:#e74c3c;font-weight:700">S/ ${(parseFloat(g.monto)||0).toFixed(2)}</td></tr>`).join('') || '<tr><td colspan="3" style="color:#718096">Sin gastos en el período</td></tr>'}
            </tbody></table>
        </div>`;
    }
}

function editarLote(id) {
    const l = DB.lotes.find(x => x.id === id);
    if (!l) return;
    document.getElementById('modalContainer').innerHTML = `
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <h3>✏️ Editar Lote: ${l.id}</h3>
                <label>Cantidad de animales</label>
                <input type="number" id="editCant" value="${l.cantidad}" placeholder="310">
                <label>Costo total S/ (opcional, actualiza gastos)</label>
                <input type="number" id="editCosto" placeholder="Dejar vacío para no cambiar">
                <p style="font-size:12px;color:#718096;margin-top:-6px">El consumo, proyecciones y núcleos se recalculan automáticamente.</p>
                <div class="modal-actions">
                    <button class="btn btn-dark btn-sm" onclick="cerrarModal()">Cancelar</button>
                    <button class="btn btn-primary" onclick="confirmarEditarLote('${id}')">✅ Guardar</button>
                </div>
            </div>
        </div>`;
    document.getElementById('modalOverlay').onclick = e => { if(e.target.id==='modalOverlay') cerrarModal(); };
}

async function confirmarEditarLote(id) {
    const l = DB.lotes.find(x => x.id === id);
    if (!l) return;
    const nuevaCant = parseInt(document.getElementById('editCant')?.value);
    const nuevoCosto = parseFloat(document.getElementById('editCosto')?.value)||0;
    if (!nuevaCant || nuevaCant <= 0) return mostrarMensaje('Ingresa una cantidad válida', 'error');

    const cantAnterior = l.cantidad;
    l.cantidad = nuevaCant;

    if (nuevoCosto > 0) {
        const g = { fecha: hoy(), concepto:`✏️ Ajuste: ${l.especie} (${id}) — ${nuevaCant} animales`, monto: nuevoCosto };
        DB.gastos.unshift({id:'G_'+Date.now(), ...g});
        await enviarAlSheet('guardarGasto', g);
    }

    guardarLocal();
    cerrarModal();

    const res = await enviarAlSheet('editarLote', { id, cantidad: nuevaCant });
    mostrarMensaje(res.success ?
        `✅ Lote actualizado: ${cantAnterior} → ${nuevaCant} animales` :
        '⚠️ Guardado local. Sincroniza para subir al Sheet.', res.success?'ok':'info');
    renderizar(vistaActual);
}

async function regLote() {
    const id = document.getElementById('loteID')?.value.trim();
    const esp = document.getElementById('loteEspecie')?.value;
    const cant = parseInt(document.getElementById('loteCant')?.value);
    const costo = parseFloat(document.getElementById('loteCosto')?.value)||0;
    const fecha = document.getElementById('loteFecha')?.value;
    if (!id||!cant||!fecha) return mostrarMensaje('Completa todos los campos', 'error');
    if (DB.lotes.find(l=>l.id===id)) return mostrarMensaje('Ya existe ese lote', 'error');
    mostrarModal('Registrar Lote', `<b>${id}</b><br>${esp}: ${cant} animales<br>Fecha: ${fecha}<br>Costo: S/ ${costo}`, async () => {
        const lote = {id, especie:esp, cantidad:cant, fechaLlegada:fecha, loteOrigen:'', sexo:''};
        DB.lotes.push(lote);
        if (costo > 0) {
            DB.gastos.unshift({id:'G_'+Date.now(), fecha, concepto:`🐾 Compra: ${esp} (${id})`, monto:costo});
        }
        guardarLocal();
        const res = await enviarAlSheet('guardarLote', {...lote, costo});
        if (!res.success) PENDIENTES.push({accion:'guardarLote', datos:{...lote, costo}});
        mostrarMensaje(res.success ? '✅ Lote registrado' : '⚠️ Guardado local. Sincroniza.', res.success?'ok':'info');
        renderizar(vistaActual);
    });
}

function agregarAlCarrito() {
    const ins = document.getElementById('compInsumo')?.value;
    const kg = parseFloat(document.getElementById('compKilos')?.value);
    const costo = parseFloat(document.getElementById('compCosto')?.value)||0;
    if (!ins||!kg) return mostrarMensaje('Selecciona insumo y cantidad', 'error');
    carritoCompras.push({insumo:ins, kilos:kg, costo});
    document.getElementById('compKilos').value = '';
    document.getElementById('compCosto').value = '';
    renderCarrito();
    mostrarMensaje(`✅ ${ins} agregado`);
}

function renderCarrito() {
    const div = document.getElementById('carritoItems');
    const totalDiv = document.getElementById('carritoTotal');
    const btnDiv = document.getElementById('btnComprar');
    if (!div) return;
    if (!carritoCompras.length) {
        div.innerHTML = '<p style="color:#718096;font-size:13px">Agrega productos al carrito</p>';
        if (totalDiv) totalDiv.style.display='none';
        if (btnDiv) btnDiv.style.display='none';
        return;
    }
    let total = 0;
    div.innerHTML = carritoCompras.map((item,i) => {
        total += item.costo;
        return `<div class="carrito-item"><div><b>${item.insumo}</b><br><small>${item.kilos} kg — S/ ${item.costo.toFixed(2)}</small></div><button class="btn btn-danger btn-xs" onclick="quitarDelCarrito(${i})">✕</button></div>`;
    }).join('');
    if (totalDiv) { totalDiv.style.display='block'; totalDiv.textContent=`Total: S/ ${total.toFixed(2)}`; }
    if (btnDiv) btnDiv.style.display='block';
}

function quitarDelCarrito(i) { carritoCompras.splice(i,1); renderCarrito(); }

async function confirmarCompras() {
    if (!carritoCompras.length) return;
    const prov = document.getElementById('compProv')?.value;
    const fecha = document.getElementById('compFecha')?.value||hoy();
    const total = carritoCompras.reduce((s,i)=>s+i.costo,0);
    mostrarModal('Confirmar Compras', `${carritoCompras.length} productos | Total: <b>S/ ${total.toFixed(2)}</b><br>Fecha: ${fecha}`, async () => {
        let errores = 0;
        for (const item of carritoCompras) {
            const res = await enviarAlSheet('guardarCompra', {fecha, insumo:item.insumo, kilos:item.kilos, costo:item.costo, proveedor:prov});
            if (!res.success) { errores++; PENDIENTES.push({accion:'guardarCompra', datos:{fecha, insumo:item.insumo, kilos:item.kilos, costo:item.costo}}); }
            const s = DB.stock.find(st=>st.nombre===item.insumo);
            if (s) s.cantidad += item.kilos; else DB.stock.push({nombre:item.insumo, cantidad:item.kilos});
            if (item.costo>0) DB.gastos.unshift({id:'G_'+Date.now(), fecha, concepto:'🛒 Compra: '+item.insumo+' ('+item.kilos+' kg)', monto:item.costo});
        }
        carritoCompras = [];
        guardarLocal();
        mostrarMensaje(errores ? '⚠️ Algunas compras con error. Sincroniza.' : '✅ Compras registradas');
        renderizar(vistaActual);
    });
}

function renderProyeccion() {
    const div = document.getElementById('proyeccionCompras');
    if (!div) return;
    const activos = lotesActivos();
    const futuros = lotesFuturos();
    const todosLotes = [...activos, ...futuros];
    if (!todosLotes.length) { div.innerHTML = '<p style="color:#718096">Sin lotes registrados</p>'; return; }

    const necesidadBase = {};
    const lotesParaBase = [...activos, ...futuros.filter(l => diasParaLlegada(l.fechaLlegada) <= 14)];
    lotesParaBase.forEach(l => {
        const diasHastaLlegada = Math.max(0, -(diaF(l.fechaLlegada) - 1));
        const diaActual = Math.max(1, diaF(l.fechaLlegada));
        for (let dia = diasHastaLlegada; dia < 14; dia++) {
            const diasDeVida = dia - diasHastaLlegada;
            const semFutura = Math.floor(((diaActual - 1) + diasDeVida) / 7) + 1;
            const formula = getFormula(l.especie, semFutura);
            const curvaRef = DB.curva.find(c => c.semana == semFutura) || DB.curva.find(c => c.semana == 1);
            if (!curvaRef) continue;
            const esP = (l.especie||'').toLowerCase().includes('pato');
            const consumoDia = l.cantidad * (esP ?
                (l.sexo==='M' ? curvaRef.patoMacho/7 : l.sexo==='H' ? curvaRef.patoHembra/7 : (curvaRef.patoMacho+curvaRef.patoHembra)/2/7) :
                curvaRef.cerdo/7);
            if (formula === 'Corimicyn') {
                // Corimicyn se calcula aparte directamente
            } else {
                const receta = getRecetas()[formula] || {};
                for (const ing in receta) {
                    if (!NUCLEOS.includes(ing)) {
                        necesidadBase[ing] = (necesidadBase[ing]||0) + (receta[ing]/500)*consumoDia;
                    }
                }
            }
        }
    });

    const necesidadNucleos14 = {};
    todosLotes.forEach(l => {
        const diasHastaLlegadaN = Math.max(0, -(diaF(l.fechaLlegada) - 1));
        const diaActual = Math.max(1, diaF(l.fechaLlegada));
        for (let dia = diasHastaLlegadaN; dia < 14; dia++) {
            const diasDeVidaN = dia - diasHastaLlegadaN;
            const semFutura = Math.floor(((diaActual - 1) + diasDeVidaN) / 7) + 1;
            const formula = getFormula(l.especie, semFutura);
            if (formula === 'Corimicyn') continue;
            const curvaRef = DB.curva.find(c => c.semana == semFutura) || DB.curva.find(c => c.semana == 1);
            if (!curvaRef) continue;
            const esP = (l.especie||'').toLowerCase().includes('pato');
            const consumoDia = l.cantidad * (esP ?
                (l.sexo==='M' ? curvaRef.patoMacho/7 : l.sexo==='H' ? curvaRef.patoHembra/7 : (curvaRef.patoMacho+curvaRef.patoHembra)/2/7) :
                curvaRef.cerdo/7);
            const receta = getRecetas()[formula] || {};
            for (const ing in receta) {
                if (NUCLEOS.includes(ing) || NUCLEOS.some(n => n.replace('Nucleo ','Núcleo ') === ing)) {
                    necesidadNucleos14[ing] = (necesidadNucleos14[ing]||0) + (receta[ing]/500)*consumoDia;
                }
            }
        }
    });

    let html = `<div style="font-size:12px;color:#718096;margin-bottom:12px">
        Proyección 14 días${futuros.length ? ` — incluye ${futuros.length} lote(s) futuro(s) en núcleos` : ''}
    </div>`;

    const faltaMolino = INSUMOS_MOLINO.filter(ing => {
        const stock = getStock(ing);
        return (necesidadBase[ing] || 0) > stock;
    }).map(ing => ({
        ing,
        faltante: (necesidadBase[ing] || 0) - getStock(ing),
        stock: getStock(ing),
        necesario: necesidadBase[ing] || 0
    }));

    if (faltaMolino.length) {
        html += `<div style="background:#fff3e0;border-radius:10px;padding:14px;margin-bottom:14px;border-left:4px solid #e67e22">
            <div style="font-weight:700;font-size:14px;margin-bottom:8px">🏭 Molino <small style="font-weight:400;color:#718096">(cualquier día excepto domingo)</small></div>`;
        faltaMolino.forEach(x => {
            html += `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ffe0b2;font-size:13px">
                <span>🔴 <b>${x.ing}</b></span>
                <span>faltan <b>${x.faltante.toFixed(1)} kg</b> <small style="color:#718096">(stock: ${x.stock.toFixed(1)})</small></span>
            </div>`;
        });
        html += '</div>';
    } else {
        html += `<div class="alerta-ok alerta-item" style="margin-bottom:12px">✅ Molino: stock suficiente 14 días</div>`;
    }

    const nucleosInfo = [];
    let totalSacosNecesarios = 0;

    NUCLEOS.forEach(ing => {
        if (NUCLEOS_CERDO.includes(ing) && !hayCerdos()) return;
        if (NUCLEOS_PATO.includes(ing) && !hayPatos()) return;
        const ingTilde = ing.replace('Nucleo ','Núcleo ');
        const necesario14 = (necesidadNucleos14[ing]||0) + (necesidadNucleos14[ingTilde]||0);
        const stockActual = getStock(ing) || getStock(ingTilde);
        const faltante = Math.max(0, necesario14 - stockActual);
        const kgPorSaco = NUCLEOS_KG[ing] || 10;
        const sacosNecesarios = faltante > 0 ? Math.ceil(faltante/kgPorSaco) : 0;
        if (necesario14 === 0 && stockActual === 0) return;
        nucleosInfo.push({ ing, stockActual, necesario14, faltante, sacosNecesarios, kgPorSaco });
        totalSacosNecesarios += sacosNecesarios;
    });

    html += `<div style="background:#e8f4fd;border-radius:10px;padding:14px;margin-bottom:14px;border-left:4px solid #3498db">
        <div style="font-weight:700;font-size:14px;margin-bottom:4px">🏔️ Montana — Núcleos <small style="font-weight:400;color:#718096">(pedir lunes, llega martes)</small></div>`;

    if (totalSacosNecesarios === 0) {
        html += `<div style="color:#27ae60;font-size:13px;margin:8px 0">✅ Stock suficiente para las próximas 2 semanas</div>`;
    } else {
        if (totalSacosNecesarios < 6) {
            const sacosFaltanParaGratis = 6 - totalSacosNecesarios;
            html += `<div style="background:#fff3cd;border-radius:6px;padding:8px 12px;margin:8px 0;font-size:13px;border-left:3px solid #f0ad4e">
                ⚠️ Necesitas <b>${totalSacosNecesarios} saco(s)</b> — pide mínimo 6 para envío gratis.<br>
                💡 Pide <b>${sacosFaltanParaGratis} saco(s) extra</b> del núcleo que más usarás próximamente.
            </div>`;
        }
    }

    nucleosInfo.forEach(n => {
        if (NUCLEOS_CERDO.includes(n.ing) && !hayCerdos()) return;
        if (NUCLEOS_PATO.includes(n.ing) && !hayPatos()) return;
        if (n.necesario14 === 0 && n.stockActual === 0) return;
        const color = n.faltante > 0 ? '#e74c3c' : '#27ae60';
        const icono = n.faltante > 0 ? '🔴' : '✅';
        const sacosStockStr = n.stockActual > 0 ?
            (n.stockActual / n.kgPorSaco >= 1 ?
                Math.floor(n.stockActual / n.kgPorSaco) + ' sacos' :
                '~' + (n.stockActual / n.kgPorSaco).toFixed(1) + ' sacos') :
            '0 sacos';
        html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #bee3f8;font-size:13px">
            <div>${icono} <b>${n.ing}</b><br>
            <small style="color:#718096">Stock: ${n.stockActual.toFixed(1)} kg (${sacosStockStr}) | 14 días: ${n.necesario14.toFixed(1)} kg</small></div>
            <div style="text-align:right;color:${color};font-weight:700">${n.sacosNecesarios > 0 ? n.sacosNecesarios+' saco(s)' : 'OK'}</div>
        </div>`;
    });

    html += `<div style="font-size:12px;color:#3498db;margin-top:8px;font-weight:600">
        📦 Total sacos a pedir: ${totalSacosNecesarios} ${totalSacosNecesarios >= 6 ? '✅ Envío gratis' : totalSacosNecesarios > 0 ? '→ completa hasta 6 para envío gratis' : ''}
    </div>`;
    html += '</div>';

    // Corimicyn: calcular también desde lotes futuros semana 1 directamente
    const todosLotesFuturos14 = lotesFuturos().filter(l => diasParaLlegada(l.fechaLlegada) <= 14);
    let corimicynFuturo = 0;
    todosLotesFuturos14.forEach(l => {
        const diasHasta = diasParaLlegada(l.fechaLlegada) - 1; // días hasta que llega
        const diasActivos = 14 - diasHasta; // días activos en el período
        const diasSem1 = Math.min(diasActivos, 7); // máx 7 días en semana 1
        if (diasSem1 > 0) {
            const curvaS1 = DB.curva.find(c => c.semana == 1);
            if (curvaS1) {
                const consumoDia = l.cantidad * (curvaS1.patoMacho + curvaS1.patoHembra) / 2 / 7;
                corimicynFuturo += consumoDia * diasSem1;
            }
        }
    });
    const necesidadCorimicyn = (necesidadBase['Corimicyn'] || 0) + corimicynFuturo;
    const stockCorimicyn = getStock('Corimicyn');
    if (necesidadCorimicyn > stockCorimicyn) {
        const faltante = necesidadCorimicyn - stockCorimicyn;
        html += `<div class="proyeccion-critica proyeccion-item">🔴 <b>Corimicyn</b>: faltan ${faltante.toFixed(2)} kg<br><small>Stock: ${stockCorimicyn.toFixed(2)} kg | Necesitas: ${necesidadCorimicyn.toFixed(2)} kg en 14 días</small></div>`;
    }

    div.innerHTML = html;
}


function renderProyeccionNucleos() {
    const div = document.getElementById('proyeccionNucleos');
    if (!div) return;

    const lotesPato = [...lotesActivos(), ...lotesFuturos()].filter(l => (l.especie||'').toLowerCase().includes('pato'));
    if (!lotesPato.length) { div.innerHTML = '<p style="color:#718096">Sin lotes de patos. Sincroniza.</p>'; return; }
    if (!DB.curva.length) { div.innerHTML = '<p style="color:#718096">Sincroniza primero.</p>'; return; }

    const ETAPAS = [
        { nombre: 'Inicio',      semIni: 2, semFin: 3,  nucleo: 'Nucleo Pato Inicio',      formula: 'Pato Inicio' },
        { nombre: 'Crecimiento', semIni: 4, semFin: 7,  nucleo: 'Nucleo Pato Crecimiento', formula: 'Pato Crecimiento' },
        { nombre: 'Acabado',     semIni: 8, semFin: 12, nucleo: 'Nucleo Pato Acabado',     formula: 'Pato Acabado' }
    ];

    const hoyDate = new Date(hoy() + 'T00:00:00');
    const recetas = getRecetas();

    // Stock actual por núcleo (compartido entre lotes)
    const stockNucleos = {};
    ETAPAS.forEach(e => {
        stockNucleos[e.nucleo] = getStock(e.nucleo) || getStock(e.nucleo.replace('Nucleo ','Núcleo '));
    });

    // Necesidad consolidada por núcleo (todos los lotes)
    const necesidadTotal = { 'Nucleo Pato Inicio': 0, 'Nucleo Pato Crecimiento': 0, 'Nucleo Pato Acabado': 0 };

    // Calcular necesidad por lote
    const datosLotes = lotesPato.map(l => {
        const fechaLlegada = new Date(l.fechaLlegada + 'T00:00:00');
        const esFuturo = diaF(l.fechaLlegada) < 1;

        const etapasLote = ETAPAS.map(etapa => {
            const diaIniEtapa = (etapa.semIni - 1) * 7;
            const diaFinEtapa = etapa.semFin * 7 - 1;
            const fechaIni = new Date(fechaLlegada.getTime() + diaIniEtapa * 86400000);
            const fechaFin = new Date(fechaLlegada.getTime() + diaFinEtapa * 86400000);

            // Solo contar días restantes desde hoy
            const diaIniEfectivo = hoyDate > fechaIni ? hoyDate : fechaIni;
            const diasRestantes = fechaFin >= hoyDate
                ? Math.floor((fechaFin - diaIniEfectivo) / 86400000) + 1
                : 0;

            // Estado de la etapa
            let estado;
            if (fechaFin < hoyDate) estado = 'completada';
            else if (fechaIni <= hoyDate) estado = 'en_curso';
            else estado = 'proxima';

            // Consumo diario promedio de la etapa
            let consumoDiaProm = 0;
            for (let s = etapa.semIni; s <= etapa.semFin; s++) {
                const curvaS = DB.curva.find(c => c.semana == s) || DB.curva[0];
                if (curvaS) consumoDiaProm += (curvaS.patoMacho + curvaS.patoHembra) / 2 / 7;
            }
            consumoDiaProm /= (etapa.semFin - etapa.semIni + 1);

            // Kg de alimento restantes en esta etapa
            const kgAlimento = l.cantidad * consumoDiaProm * diasRestantes;

            // Kg de núcleo necesarios
            const receta = recetas[etapa.formula] || {};
            const kgNucleoReceta = receta[etapa.nucleo] || receta[etapa.nucleo.replace('Nucleo ','Núcleo ')] || 0;
            const kgNucleo = kgNucleoReceta > 0 ? (kgNucleoReceta / 500) * kgAlimento : 0;
            const kgPorSaco = NUCLEOS_KG[etapa.nucleo] || 10;

            if (estado !== 'completada') {
                necesidadTotal[etapa.nucleo] = (necesidadTotal[etapa.nucleo] || 0) + kgNucleo;
            }

            return {
                ...etapa,
                fechaIni: fechaIni.toISOString().split('T')[0],
                fechaFin: fechaFin.toISOString().split('T')[0],
                diasRestantes,
                kgNucleo,
                sacos: kgNucleo / kgPorSaco,
                kgPorSaco,
                estado
            };
        });

        return { lote: l, esFuturo, etapas: etapasLote };
    });

    // ===== RENDER =====
    let html = '';

    // Tabla por lote
    datosLotes.forEach(({ lote, esFuturo, etapas }) => {
        const borderColor = esFuturo ? '#9b59b6' : '#3498db';
        const etiqueta = esFuturo
            ? `<span style="background:#9b59b6;color:white;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700">FUTURO</span>`
            : `<span style="background:#3498db;color:white;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700">ACTIVO</span>`;

        html += `<div style="border-left:4px solid ${borderColor};padding:14px;background:#f7fafc;border-radius:8px;margin-bottom:16px">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
                <b style="font-size:15px">🦆 ${lote.id}</b> ${etiqueta}
                <span style="color:#718096;font-size:12px">${lote.cantidad} animales | Llegada: ${lote.fechaLlegada}</span>
            </div>
            <table style="width:100%;border-collapse:collapse;font-size:13px">
                <thead>
                    <tr style="background:#e2e8f0">
                        <th style="padding:8px;text-align:left">Etapa</th>
                        <th style="padding:8px;text-align:left">Núcleo</th>
                        <th style="padding:8px;text-align:center">Semanas</th>
                        <th style="padding:8px;text-align:center">Hasta</th>
                        <th style="padding:8px;text-align:right">Días restantes</th>
                        <th style="padding:8px;text-align:right">Kg núcleo</th>
                        <th style="padding:8px;text-align:right">Sacos</th>
                    </tr>
                </thead>
                <tbody>`;

        etapas.forEach(e => {
            let estadoLabel = '';
            if (e.estado === 'completada') estadoLabel = '<span style="color:#718096;font-size:11px">✓ Completada</span>';
            else if (e.estado === 'en_curso') estadoLabel = '<span style="color:#27ae60;font-size:11px;font-weight:700">▶ En curso</span>';
            else estadoLabel = '<span style="color:#3498db;font-size:11px">◷ Próxima</span>';

            const colorKg = e.estado === 'completada' ? '#718096' : e.kgNucleo > 0 ? '#2d3748' : '#718096';
            const rowBg = e.estado === 'completada' ? 'opacity:0.5' : '';

            html += `<tr style="border-bottom:1px solid #e2e8f0;${rowBg}">
                <td style="padding:8px">${e.nombre} ${estadoLabel}</td>
                <td style="padding:8px;color:#718096">${e.nucleo.replace('Nucleo ','')}</td>
                <td style="padding:8px;text-align:center">S${e.semIni}–S${e.semFin}</td>
                <td style="padding:8px;text-align:center;font-size:12px;color:#718096">${e.fechaFin}</td>
                <td style="padding:8px;text-align:right;color:#718096">${e.estado === 'completada' ? '—' : e.diasRestantes + 'd'}</td>
                <td style="padding:8px;text-align:right;font-weight:700;color:${colorKg}">${e.estado === 'completada' ? '—' : e.kgNucleo.toFixed(1) + ' kg'}</td>
                <td style="padding:8px;text-align:right">${e.estado === 'completada' ? '—' : e.sacos.toFixed(1)}</td>
            </tr>`;
        });

        html += `</tbody></table></div>`;
    });

    // ===== RESUMEN CONSOLIDADO =====
    html += `<div style="background:#1a202c;color:white;padding:16px;border-radius:10px;margin-top:8px">
        <div style="font-size:14px;font-weight:700;margin-bottom:12px">📦 Resumen consolidado — todos los lotes</div>
        <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead>
                <tr style="border-bottom:1px solid #4a5568">
                    <th style="padding:8px;text-align:left;color:#a0aec0">Núcleo</th>
                    <th style="padding:8px;text-align:right;color:#a0aec0">Stock actual</th>
                    <th style="padding:8px;text-align:right;color:#a0aec0">Total necesario</th>
                    <th style="padding:8px;text-align:right;color:#a0aec0">Faltante</th>
                    <th style="padding:8px;text-align:right;color:#a0aec0">Sacos a comprar</th>
                </tr>
            </thead>
            <tbody>`;

    ETAPAS.forEach(e => {
        const stock = stockNucleos[e.nucleo] || 0;
        const necesario = necesidadTotal[e.nucleo] || 0;
        const faltante = Math.max(0, necesario - stock);
        const sacosComprar = Math.ceil(faltante / (NUCLEOS_KG[e.nucleo] || 10));
        const color = faltante > 0 ? '#fc8181' : '#68d391';
        const icono = faltante > 0 ? '🔴' : '✅';

        html += `<tr style="border-bottom:1px solid #2d3748">
            <td style="padding:8px;font-weight:600">${icono} ${e.nucleo.replace('Nucleo ','')}</td>
            <td style="padding:8px;text-align:right;color:#68d391">${stock.toFixed(1)} kg (${(stock/(NUCLEOS_KG[e.nucleo]||10)).toFixed(1)} sacos)</td>
            <td style="padding:8px;text-align:right;color:#a0aec0">${necesario.toFixed(1)} kg</td>
            <td style="padding:8px;text-align:right;color:${color};font-weight:700">${faltante > 0 ? faltante.toFixed(1)+' kg' : '—'}</td>
            <td style="padding:8px;text-align:right;color:${color};font-weight:700">${faltante > 0 ? sacosComprar+' saco(s)' : 'OK'}</td>
        </tr>`;
    });

    html += `</tbody></table>
        <div style="font-size:11px;color:#718096;margin-top:8px">* Considera días restantes de etapas en curso + etapas futuras de todos los lotes</div>
    </div>`;

    div.innerHTML = html;
}



function renderCalendarioPedidos() {
    const div = document.getElementById('calendarioPedidos');
    if (!div) return;

    const lotesPato = [...lotesActivos(), ...lotesFuturos()].filter(l => (l.especie||'').toLowerCase().includes('pato'));
    if (!lotesPato.length || !DB.curva.length) {
        div.innerHTML = '<p style="color:#718096">Sin lotes. Sincroniza.</p>';
        return;
    }

    const NUCLEOS_INFO = [
        { nucleo: 'Nucleo Pato Inicio',      formula: 'Pato Inicio',      semIni: 2, semFin: 3,  kgPorSaco: 10 },
        { nucleo: 'Nucleo Pato Crecimiento', formula: 'Pato Crecimiento', semIni: 4, semFin: 7,  kgPorSaco: 10 },
        { nucleo: 'Nucleo Pato Acabado',     formula: 'Pato Acabado',     semIni: 8, semFin: 12, kgPorSaco: 10 }
    ];

    const hoyDate = new Date(hoy() + 'T00:00:00');
    const recetas = getRecetas();

    // Stock actual
    const stockActual = {};
    NUCLEOS_INFO.forEach(n => {
        stockActual[n.nucleo] = Math.max(0, getStock(n.nucleo) || getStock(n.nucleo.replace('Nucleo ','Núcleo ')) || 0);
    });

    // Construir timeline de necesidades por nucleo y fecha
    const timeline = [];
    lotesPato.forEach(l => {
        const fechaLlegada = new Date(l.fechaLlegada + 'T00:00:00');
        NUCLEOS_INFO.forEach(ni => {
            const diaIni = (ni.semIni - 1) * 7;
            const diaFin = ni.semFin * 7 - 1;
            const fechaIni = new Date(fechaLlegada.getTime() + diaIni * 86400000);
            const fechaFin = new Date(fechaLlegada.getTime() + diaFin * 86400000);
            if (fechaFin < hoyDate) return;

            const diaIniEfectivo = hoyDate > fechaIni ? hoyDate : fechaIni;
            const diasRestantes = Math.floor((fechaFin - diaIniEfectivo) / 86400000) + 1;
            if (diasRestantes <= 0) return;

            let consumoDiaProm = 0;
            for (let s = ni.semIni; s <= ni.semFin; s++) {
                const curvaS = DB.curva.find(c => c.semana == s) || DB.curva[0];
                if (curvaS) consumoDiaProm += (curvaS.patoMacho + curvaS.patoHembra) / 2 / 7;
            }
            consumoDiaProm /= (ni.semFin - ni.semIni + 1);
            if (isNaN(consumoDiaProm) || consumoDiaProm <= 0) return;

            const kgAlimento = l.cantidad * consumoDiaProm * diasRestantes;
            const receta = recetas[ni.formula] || {};
            const kgNucleoReceta = parseFloat(receta[ni.nucleo] || receta[ni.nucleo.replace('Nucleo ','Núcleo ')] || 0);
            if (kgNucleoReceta <= 0) return;
            const kgNucleo = (kgNucleoReceta / 500) * kgAlimento;
            if (kgNucleo <= 0 || isNaN(kgNucleo)) return;

            timeline.push({
                fechaInicio: diaIniEfectivo,
                fechaFin,
                nucleo: ni.nucleo,
                kg: kgNucleo,
                kgPorSaco: ni.kgPorSaco,
                loteId: l.id
            });
        });
    });

    if (!timeline.length) {
        div.innerHTML = '<div class="alerta-ok alerta-item">✅ Sin necesidades próximas</div>';
        return;
    }

    // Generar pedidos — primer lunes desde hoy
    const diasHastaLunes = ((8 - hoyDate.getDay()) % 7) || 7;
    const primerLunes = new Date(hoyDate.getTime() + diasHastaLunes * 86400000);

    const pedidos = [];
    const stockSim = { ...stockActual };
    const yaAdelantado = {};
    NUCLEOS_INFO.forEach(n => yaAdelantado[n.nucleo] = 0);

    for (let p = 0; p < 4; p++) {
        const fechaPedido = new Date(primerLunes.getTime() + p * 21 * 86400000);
        const fechaLlegadaPedido = new Date(fechaPedido.getTime() + 86400000);
        const ventanaFin = new Date(fechaPedido.getTime() + 21 * 86400000);

        // Necesidad real en esta ventana
        const necesidadVentana = {};
        NUCLEOS_INFO.forEach(n => necesidadVentana[n.nucleo] = 0);

        timeline.forEach(t => {
            const inicioSolap = t.fechaInicio > fechaLlegadaPedido ? t.fechaInicio : fechaLlegadaPedido;
            const finSolap = t.fechaFin < ventanaFin ? t.fechaFin : ventanaFin;
            if (inicioSolap > finSolap) return;
            const diasTotales = Math.floor((t.fechaFin - t.fechaInicio) / 86400000) + 1;
            const diasSolap = Math.floor((finSolap - inicioSolap) / 86400000) + 1;
            const kgProp = t.kg * (diasSolap / diasTotales);
            if (!isNaN(kgProp)) necesidadVentana[t.nucleo] += kgProp;
        });

        // Items necesarios (descontando stock simulado)
        const items = [];
        let totalSacos = 0;

        NUCLEOS_INFO.forEach(ni => {
            const necesario = necesidadVentana[ni.nucleo] || 0;
            const stockDisp = Math.max(0, (stockSim[ni.nucleo] || 0) - (yaAdelantado[ni.nucleo] || 0));
            const faltante = Math.max(0, necesario - stockDisp);
            if (faltante <= 0) return;
            const sacos = Math.ceil(faltante / ni.kgPorSaco);
            const kg = sacos * ni.kgPorSaco;
            items.push({ nucleo: ni.nucleo, sacos, kg, kgPorSaco: ni.kgPorSaco });
            totalSacos += sacos;
        });

        if (items.length === 0) continue;

        // Adelantar para llegar a 6 si hace falta
        const adelantos = [];
        if (totalSacos < 6) {
            const faltanParaGratis = 6 - totalSacos;

            // Candidatos: núcleos NO en este pedido con necesidad futura
            const candidatos = NUCLEOS_INFO.map(ni => {
                if (items.find(i => i.nucleo === ni.nucleo)) return null; // ya está en el pedido
                let kgFuturo = 0;
                timeline.forEach(t => {
                    if (t.nucleo !== ni.nucleo) return;
                    if (t.fechaFin <= ventanaFin) return;
                    const stockRestante = Math.max(0, (stockSim[ni.nucleo]||0) - (yaAdelantado[ni.nucleo]||0));
                    kgFuturo += Math.max(0, t.kg - stockRestante);
                });
                if (kgFuturo <= 0) return null;
                const sacosFuturos = Math.ceil(kgFuturo / ni.kgPorSaco);
                return { nucleo: ni.nucleo, sacosFuturos, kgFuturo, kgPorSaco: ni.kgPorSaco };
            }).filter(Boolean).sort((a,b) => b.kgFuturo - a.kgFuturo);

            if (candidatos.length > 0) {
                const mejor = candidatos[0];
                const sacosAdelantar = Math.min(faltanParaGratis, mejor.sacosFuturos);
                if (sacosAdelantar > 0) {
                    adelantos.push({ nucleo: mejor.nucleo, sacos: sacosAdelantar, kgPorSaco: mejor.kgPorSaco });
                    yaAdelantado[mejor.nucleo] = (yaAdelantado[mejor.nucleo]||0) + sacosAdelantar * mejor.kgPorSaco;
                    totalSacos += sacosAdelantar;
                }
            }
        }

        // Actualizar stock simulado con lo que se compra
        items.forEach(item => { stockSim[item.nucleo] = (stockSim[item.nucleo]||0) + item.kg; });
        adelantos.forEach(adel => { stockSim[adel.nucleo] = (stockSim[adel.nucleo]||0) + adel.sacos * adel.kgPorSaco; });

        pedidos.push({ fechaPedido, fechaLlegadaPedido, items, adelantos, totalSacos });
    }

    if (!pedidos.length) {
        div.innerHTML = '<div class="alerta-ok alerta-item">✅ Stock suficiente, sin pedidos necesarios próximamente</div>';
        return;
    }

    const fmtF = d => d.toISOString().split('T')[0];
    const diasHasta = d => Math.floor((d - hoyDate) / 86400000);

    let html = '';
    pedidos.forEach((ped, idx) => {
        const dias = diasHasta(ped.fechaPedido);
        const urgente = dias <= 3;
        const color = urgente ? '#e74c3c' : idx === 1 ? '#e67e22' : '#3498db';
        const bg = urgente ? '#fff5f5' : idx === 1 ? '#fffaf0' : '#ebf8ff';
        const icono = urgente ? '🔴' : idx === 1 ? '🟡' : '🔵';
        const label = urgente ? 'URGENTE' : dias <= 14 ? 'PRÓXIMO' : 'PLANIFICADO';
        const envioGratis = ped.totalSacos >= 6;

        html += `<div style="border:2px solid ${color};border-radius:10px;margin-bottom:14px;overflow:hidden">
            <div style="background:${bg};padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
                <div>
                    <span style="font-weight:700;font-size:14px">${icono} Pedido ${idx+1} — ${label}</span>
                    <span style="color:#718096;font-size:12px;margin-left:10px">
                        Pedir: <b>${fmtF(ped.fechaPedido)}</b> (lunes) | Llega: <b>${fmtF(ped.fechaLlegadaPedido)}</b>
                    </span>
                </div>
                <span style="background:${color};color:white;padding:4px 12px;border-radius:6px;font-weight:700;font-size:12px">
                    ${ped.totalSacos} sacos ${envioGratis ? '✅ envío gratis' : '⚠️ sin envío gratis'}
                </span>
            </div>
            <div style="padding:10px 16px">`;

        ped.items.forEach(item => {
            html += `<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #e2e8f0;font-size:13px">
                <span>📦 <b>${item.nucleo.replace('Nucleo ','')}</b> <span style="color:#718096;font-size:11px">(necesario)</span></span>
                <span style="font-weight:700">${item.sacos} saco(s) — ${item.kg.toFixed(0)} kg</span>
            </div>`;
        });

        ped.adelantos.forEach(adel => {
            html += `<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #e2e8f0;font-size:13px;background:#fffbea">
                <span>⏩ <b>${adel.nucleo.replace('Nucleo ','')}</b> <span style="color:#e67e22;font-size:11px">(adelantado para envío gratis)</span></span>
                <span style="font-weight:700;color:#e67e22">${adel.sacos} saco(s) — ${(adel.sacos*adel.kgPorSaco).toFixed(0)} kg</span>
            </div>`;
        });

        if (!envioGratis) {
            html += `<div style="background:#fff3cd;padding:7px 10px;border-radius:6px;margin-top:8px;font-size:12px">
                ⚠️ Solo ${ped.totalSacos} sacos — considera si vale la pena pagar envío o combinar con el siguiente pedido
            </div>`;
        }

        html += `</div></div>`;
    });

    div.innerHTML = html;
}


function renderProyeccionNucleos() {

    if (!DB.curva.length) { div.innerHTML = '<p style="color:#718096">Sincroniza primero.</p>'; return; }

    const ETAPAS = [
        { nombre: 'Inicio',      semIni: 2, semFin: 3,  nucleo: 'Nucleo Pato Inicio',      formula: 'Pato Inicio' },
        { nombre: 'Crecimiento', semIni: 4, semFin: 7,  nucleo: 'Nucleo Pato Crecimiento', formula: 'Pato Crecimiento' },
        { nombre: 'Acabado',     semIni: 8, semFin: 12, nucleo: 'Nucleo Pato Acabado',     formula: 'Pato Acabado' }
    ];

    const hoyDate = new Date(hoy() + 'T00:00:00');
    const recetas = getRecetas();

    // Stock actual por núcleo (compartido entre lotes)
    const stockNucleos = {};
    ETAPAS.forEach(e => {
        stockNucleos[e.nucleo] = getStock(e.nucleo) || getStock(e.nucleo.replace('Nucleo ','Núcleo '));
    });

    // Necesidad consolidada por núcleo (todos los lotes)
    const necesidadTotal = { 'Nucleo Pato Inicio': 0, 'Nucleo Pato Crecimiento': 0, 'Nucleo Pato Acabado': 0 };

    // Calcular necesidad por lote
    const datosLotes = lotesPato.map(l => {
        const fechaLlegada = new Date(l.fechaLlegada + 'T00:00:00');
        const esFuturo = diaF(l.fechaLlegada) < 1;

        const etapasLote = ETAPAS.map(etapa => {
            const diaIniEtapa = (etapa.semIni - 1) * 7;
            const diaFinEtapa = etapa.semFin * 7 - 1;
            const fechaIni = new Date(fechaLlegada.getTime() + diaIniEtapa * 86400000);
            const fechaFin = new Date(fechaLlegada.getTime() + diaFinEtapa * 86400000);

            // Solo contar días restantes desde hoy
            const diaIniEfectivo = hoyDate > fechaIni ? hoyDate : fechaIni;
            const diasRestantes = fechaFin >= hoyDate
                ? Math.floor((fechaFin - diaIniEfectivo) / 86400000) + 1
                : 0;

            // Estado de la etapa
            let estado;
            if (fechaFin < hoyDate) estado = 'completada';
            else if (fechaIni <= hoyDate) estado = 'en_curso';
            else estado = 'proxima';

            // Consumo diario promedio de la etapa

            // Kg de alimento restantes en esta etapa
            const kgAlimento = l.cantidad * consumoDiaProm * diasRestantes;

            // Kg de núcleo necesarios

            const kgNucleoReceta = receta[etapa.nucleo] || receta[etapa.nucleo.replace('Nucleo ','Núcleo ')] || 0;
            const kgNucleo = kgNucleoReceta > 0 ? (kgNucleoReceta / 500) * kgAlimento : 0;
            const kgPorSaco = NUCLEOS_KG[etapa.nucleo] || 10;

            if (estado !== 'completada') {
                necesidadTotal[etapa.nucleo] = (necesidadTotal[etapa.nucleo] || 0) + kgNucleo;

                ...etapa,
                fechaIni: fechaIni.toISOString().split('T')[0],
                fechaFin: fechaFin.toISOString().split('T')[0],
                diasRestantes,
                kgNucleo,
                sacos: kgNucleo / kgPorSaco,
                kgPorSaco,
                estado

            : `<span style="background:#3498db;color:white;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700">ACTIVO</span>`;

                <b style="font-size:15px">🦆 ${lote.id}</b> ${etiqueta}
                <span style="color:#718096;font-size:12px">${lote.cantidad} animales | Llegada: ${lote.fechaLlegada}</span>
            </div>
            <table style="width:100%;border-collapse:collapse;font-size:13px">
                <thead>
                    <tr style="background:#e2e8f0">
                        <th style="padding:8px;text-align:left">Etapa</th>
                        <th style="padding:8px;text-align:left">Núcleo</th>
                        <th style="padding:8px;text-align:center">Semanas</th>
                        <th style="padding:8px;text-align:center">Hasta</th>
                        <th style="padding:8px;text-align:right">Días restantes</th>
                        <th style="padding:8px;text-align:right">Kg núcleo</th>
                        <th style="padding:8px;text-align:right">Sacos</th>
                    </tr>
