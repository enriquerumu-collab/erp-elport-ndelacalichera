            else if (e.estado === 'en_curso') estadoLabel = '<span style="color:#27ae60;font-size:11px;font-weight:700">▶ En curso</span>';
            else estadoLabel = '<span style="color:#3498db;font-size:11px">◷ Próxima</span>';

            const colorKg = e.estado === 'completada' ? '#718096' : e.kgNucleo > 0 ? '#2d3748' : '#718096';
            const rowBg = e.estado === 'completada' ? 'opacity:0.5' : '';

            html += `<tr style="border-bottom:1px solid #e2e8f0;${rowBg}">
                <td style="padding:8px">${e.nombre} ${estadoLabel}</td>
                <td style="padding:8px;color:#718096">${e.nucleo.replace('Nucleo ','')}</td>
                <td style="padding:8px;text-align:center">S${e.semIni}–S${e.semFin}</td>
                <td style="padding:8px;text-align:center;font-size:12px;color:#718096">${e.fechaFin}</td>
                <td style="padding:8px;text-align:right;color:#718096">${e.estado === 'completada' ? '—' : e.diasRestantes + 'd'}</td>
                <td style="padding:8px;text-align:right;font-weight:700;color:${colorKg}">${e.estado === 'completada' ? '—' : e.kgNucleo.toFixed(1) + ' kg'}</td>
                <td style="padding:8px;text-align:right">${e.estado === 'completada' ? '—' : e.sacos.toFixed(1)}</td>
            </tr>`;
        });

        html += `</tbody></table></div>`;
    });

    // ===== RESUMEN CONSOLIDADO =====
    html += `<div style="background:#1a202c;color:white;padding:16px;border-radius:10px;margin-top:8px">
        <div style="font-size:14px;font-weight:700;margin-bottom:12px">📦 Resumen consolidado — todos los lotes</div>
        <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead>
                <tr style="border-bottom:1px solid #4a5568">
                    <th style="padding:8px;text-align:left;color:#a0aec0">Núcleo</th>
                    <th style="padding:8px;text-align:right;color:#a0aec0">Stock actual</th>
                    <th style="padding:8px;text-align:right;color:#a0aec0">Total necesario</th>
                    <th style="padding:8px;text-align:right;color:#a0aec0">Faltante</th>
                    <th style="padding:8px;text-align:right;color:#a0aec0">Sacos a comprar</th>
                </tr>
            </thead>
            <tbody>`;

    ETAPAS.forEach(e => {
        const stock = stockNucleos[e.nucleo] || 0;
        const necesario = necesidadTotal[e.nucleo] || 0;
        const faltante = Math.max(0, necesario - stock);
        const sacosComprar = Math.ceil(faltante / (NUCLEOS_KG[e.nucleo] || 10));
        const color = faltante > 0 ? '#fc8181' : '#68d391';
        const icono = faltante > 0 ? '🔴' : '✅';

        html += `<tr style="border-bottom:1px solid #2d3748">
            <td style="padding:8px;font-weight:600">${icono} ${e.nucleo.replace('Nucleo ','')}</td>
            <td style="padding:8px;text-align:right;color:#68d391">${stock.toFixed(1)} kg (${(stock/(NUCLEOS_KG[e.nucleo]||10)).toFixed(1)} sacos)</td>
            <td style="padding:8px;text-align:right;color:#a0aec0">${necesario.toFixed(1)} kg</td>
            <td style="padding:8px;text-align:right;color:${color};font-weight:700">${faltante > 0 ? faltante.toFixed(1)+' kg' : '—'}</td>
            <td style="padding:8px;text-align:right;color:${color};font-weight:700">${faltante > 0 ? sacosComprar+' saco(s)' : 'OK'}</td>
        </tr>`;
    });

    html += `</tbody></table>
        <div style="font-size:11px;color:#718096;margin-top:8px">* Considera días restantes de etapas en curso + etapas futuras de todos los lotes</div>
    </div>`;

    div.innerHTML = html;
}



function renderCalendarioPedidos() {
    const div = document.getElementById('calendarioPedidos');
    if (!div) return;

    const lotesPato = [...lotesActivos(), ...lotesFuturos()].filter(l => (l.especie||'').toLowerCase().includes('pato'));
    if (!lotesPato.length || !DB.curva.length) {
        div.innerHTML = '<p style="color:#718096">Sin lotes. Sincroniza.</p>';
        return;
    }

    const NUCLEOS_INFO = [
        { nucleo: 'Nucleo Pato Inicio',      formula: 'Pato Inicio',      semIni: 2, semFin: 3,  kgPorSaco: 10 },
        { nucleo: 'Nucleo Pato Crecimiento', formula: 'Pato Crecimiento', semIni: 4, semFin: 7,  kgPorSaco: 10 },
        { nucleo: 'Nucleo Pato Acabado',     formula: 'Pato Acabado',     semIni: 8, semFin: 12, kgPorSaco: 10 }
    ];

    const hoyDate = new Date(hoy() + 'T00:00:00');
    const recetas = getRecetas();

    // Stock actual por nucleo
    const stockActual = {};
    NUCLEOS_INFO.forEach(n => {
        stockActual[n.nucleo] = getStock(n.nucleo) || getStock(n.nucleo.replace('Nucleo ','Núcleo ')) || 0;
    });

    // Construir timeline de necesidades: { fecha, nucleo, kg, loteId }
    const timeline = [];
    lotesPato.forEach(l => {
        const fechaLlegada = new Date(l.fechaLlegada + 'T00:00:00');
        NUCLEOS_INFO.forEach(ni => {
            const diaIni = (ni.semIni - 1) * 7;
            const diaFin = ni.semFin * 7 - 1;
            const fechaIni = new Date(fechaLlegada.getTime() + diaIni * 86400000);
            const fechaFin = new Date(fechaLlegada.getTime() + diaFin * 86400000);

            // Solo etapas que aún no terminaron
            if (fechaFin < hoyDate) return;

            const diaIniEfectivo = hoyDate > fechaIni ? hoyDate : fechaIni;
            const diasRestantes = Math.floor((fechaFin - diaIniEfectivo) / 86400000) + 1;
            if (diasRestantes <= 0) return;

            // Consumo diario promedio
            let consumoDiaProm = 0;
            for (let s = ni.semIni; s <= ni.semFin; s++) {
                const curvaS = DB.curva.find(c => c.semana == s) || DB.curva[0];
                if (curvaS) consumoDiaProm += (curvaS.patoMacho + curvaS.patoHembra) / 2 / 7;
            }
            consumoDiaProm /= (ni.semFin - ni.semIni + 1);

            if (isNaN(consumoDiaProm) || consumoDiaProm <= 0) return;
            const kgAlimento = l.cantidad * consumoDiaProm * diasRestantes;
            const receta = recetas[ni.formula] || {};
            const kgNucleoReceta = parseFloat(receta[ni.nucleo] || receta[ni.nucleo.replace('Nucleo ','Núcleo ')] || 0);
            const kgNucleo = kgNucleoReceta > 0 ? (kgNucleoReceta / 500) * kgAlimento : 0;

            if (kgNucleo > 0 && !isNaN(kgNucleo)) {
                timeline.push({
                    fechaInicio: diaIniEfectivo,
                    fechaFin: fechaFin,
                    nucleo: ni.nucleo,
                    kg: kgNucleo,
                    loteId: l.id,
                    kgPorSaco: ni.kgPorSaco
                });
            }
        });
    });

    if (!timeline.length) {
        div.innerHTML = '<div class="alerta-ok alerta-item">✅ Sin necesidades de núcleos próximas</div>';
        return;
    }

    // Generar pedidos cada ~3 semanas (21 días)
    // Primer pedido: próximo lunes
    const diasHastaLunes = (8 - hoyDate.getDay()) % 7 || 7;
    const primerLunes = new Date(hoyDate.getTime() + diasHastaLunes * 86400000);
    
    const pedidos = [];
    const stockSimulado = { ...stockActual };
    const yaAdelantado = {};
    NUCLEOS_INFO.forEach(n => yaAdelantado[n.nucleo] = 0);

    // Generar hasta 4 pedidos
    for (let p = 0; p < 4; p++) {
        const fechaPedido = new Date(primerLunes.getTime() + p * 21 * 86400000);
        const fechaLlegada = new Date(fechaPedido.getTime() + 86400000); // llega martes
        const ventanaFin = new Date(fechaPedido.getTime() + 21 * 86400000); // cubre 3 semanas

        // Calcular necesidad en esta ventana por nucleo
        const necesidadVentana = {};
        NUCLEOS_INFO.forEach(n => necesidadVentana[n.nucleo] = 0);

        timeline.forEach(t => {
            // Solapamiento entre ventana [fechaLlegada, ventanaFin] y necesidad [fechaInicio, fechaFin]
            const inicioSolap = t.fechaInicio > fechaLlegada ? t.fechaInicio : fechaLlegada;
            const finSolap = t.fechaFin < ventanaFin ? t.fechaFin : ventanaFin;
            if (inicioSolap > finSolap) return;

            const diasTotales = Math.max(1, Math.floor((t.fechaFin - t.fechaInicio) / 86400000) + 1);
            const diasSolap = Math.floor((finSolap - inicioSolap) / 86400000) + 1;
            const kgProporcional = t.kg * (diasSolap / diasTotales);
            if (!isNaN(kgProporcional) && kgProporcional > 0) {
                necesidadVentana[t.nucleo] = (necesidadVentana[t.nucleo] || 0) + kgProporcional;
            }
        });

        // Calcular sacos necesarios descontando stock simulado
        const itemsPedido = [];
        let totalSacos = 0;

        NUCLEOS_INFO.forEach(ni => {
            const necesario = necesidadVentana[ni.nucleo] || 0;
            if (necesario <= 0) return;
            const stockDisp = Math.max(0, (stockSimulado[ni.nucleo] || 0) - (yaAdelantado[ni.nucleo] || 0));
            const faltante = Math.max(0, necesario - stockDisp);
            if (faltante <= 0) return;
            const sacos = Math.ceil(faltante / ni.kgPorSaco);
            const kg = sacos * ni.kgPorSaco;
            itemsPedido.push({ nucleo: ni.nucleo, sacos, kg, necesario, faltante });
            totalSacos += sacos;
        });

        if (itemsPedido.length === 0) continue;

        // Completar hasta 6 sacos si no llega
        let adelantos = [];
        if (totalSacos > 0 && totalSacos < 6) {
            const faltanParaGratis = 6 - totalSacos;
            const nucleosEnPedido = new Set(itemsPedido.map(i => i.nucleo));
            // Buscar el mejor núcleo para adelantar: que NO esté ya en el pedido, con mayor necesidad futura
            const candidatos = NUCLEOS_INFO.map(ni => {
                if (nucleosEnPedido.has(ni.nucleo)) return null; // no adelantar del mismo
                let kgFuturo = 0;
                let fechaMasProxima = null;
                timeline.forEach(t => {
                    if (t.nucleo !== ni.nucleo) return;
                    if (t.fechaInicio <= ventanaFin) return;
                    kgFuturo += t.kg;
                    if (!fechaMasProxima || t.fechaInicio < fechaMasProxima) fechaMasProxima = t.fechaInicio;
                });
                if (kgFuturo <= 0) return null;
                const stockDisp = Math.max(0, (stockSimulado[ni.nucleo]||0) - (yaAdelantado[ni.nucleo]||0));
                const faltanteFuturo = Math.max(0, kgFuturo - stockDisp);
                const sacosFuturos = Math.ceil(faltanteFuturo / ni.kgPorSaco);
                if (sacosFuturos <= 0) return null;
                return { nucleo: ni.nucleo, kgFuturo, sacosFuturos, kgPorSaco: ni.kgPorSaco, fechaMasProxima };
            }).filter(Boolean).sort((a,b) => a.fechaMasProxima - b.fechaMasProxima); // más próximo primero

            if (candidatos.length > 0) {
                const mejor = candidatos[0];
                const sacosAdelantar = Math.min(faltanParaGratis, mejor.sacosFuturos);
                if (sacosAdelantar > 0) {
                    adelantos.push({ nucleo: mejor.nucleo, sacos: sacosAdelantar, kgPorSaco: mejor.kgPorSaco });
                    yaAdelantado[mejor.nucleo] = (yaAdelantado[mejor.nucleo] || 0) + sacosAdelantar * mejor.kgPorSaco;
                    totalSacos += sacosAdelantar;
                }
            }
        }

        // Actualizar stock simulado con compras + adelantos
        itemsPedido.forEach(item => {
            stockSimulado[item.nucleo] = (stockSimulado[item.nucleo] || 0) + item.kg;
        });
        adelantos.forEach(adel => {
            stockSimulado[adel.nucleo] = (stockSimulado[adel.nucleo] || 0) + adel.sacos * adel.kgPorSaco;
        });
        // Descontar del stock simulado la necesidad de esta ventana
        NUCLEOS_INFO.forEach(ni => {
            const usado = necesidadVentana[ni.nucleo] || 0;
            stockSimulado[ni.nucleo] = Math.max(0, (stockSimulado[ni.nucleo] || 0) - usado);
        });

        pedidos.push({
            fechaPedido,
            fechaLlegada,
            items: itemsPedido,
            adelantos,
            totalSacos
        });
    }

    if (!pedidos.length) {
        div.innerHTML = '<div class="alerta-ok alerta-item">✅ Stock suficiente, sin pedidos necesarios próximamente</div>';
        return;
    }

    // ===== RENDER =====
    const diasHasta = (fecha) => Math.floor((fecha - hoyDate) / 86400000);
    const fmtFecha = (d) => d.toISOString().split('T')[0];

    let html = '';
    pedidos.forEach((ped, idx) => {
        const dias = diasHasta(ped.fechaPedido);
        const urgente = dias <= 3;
        const headerColor = urgente ? '#e74c3c' : idx === 1 ? '#e67e22' : '#3498db';
        const headerBg = urgente ? '#fff5f5' : idx === 1 ? '#fffaf0' : '#ebf8ff';
        const iconoPedido = urgente ? '🔴' : idx === 1 ? '🟡' : '🔵';
        const labelUrgencia = urgente ? 'URGENTE' : dias <= 14 ? 'PRÓXIMO' : 'PLANIFICADO';

        html += `<div style="border:2px solid ${headerColor};border-radius:10px;margin-bottom:16px;overflow:hidden">
            <div style="background:${headerBg};padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
                <div>
                    <span style="font-weight:700;font-size:15px">${iconoPedido} Pedido ${idx+1} — ${labelUrgencia}</span>
                    <span style="color:#718096;font-size:13px;margin-left:12px">Pedir: <b>${fmtFecha(ped.fechaPedido)}</b> (lunes) | Llega: <b>${fmtFecha(ped.fechaLlegada)}</b></span>
                </div>
                <span style="background:${headerColor};color:white;padding:4px 12px;border-radius:6px;font-weight:700;font-size:13px">
                    ${ped.totalSacos} sacos ${ped.totalSacos >= 6 ? '✅ envío gratis' : '⚠️ sin envío gratis'}
                </span>
            </div>
            <div style="padding:12px 16px">`;

        // Items necesarios
        ped.items.forEach(item => {
            const kgPorSaco = NUCLEOS_KG[item.nucleo] || 10;
            html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #e2e8f0;font-size:13px">
                <span>📦 <b>${item.nucleo.replace('Nucleo ','')}</b></span>
                <span style="color:#2d3748;font-weight:700">${item.sacos} saco(s) — ${item.kg.toFixed(1)} kg</span>
            </div>`;
        });

        // Adelantos
        ped.adelantos.forEach(adel => {
            const kgPorSaco = NUCLEOS_KG[adel.nucleo] || 10;
            html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #e2e8f0;font-size:13px;background:#fffbea">
                <span>⏩ <b>${adel.nucleo.replace('Nucleo ','')}</b> <span style="color:#718096;font-size:11px">(adelantado para llegar a 6)</span></span>
                <span style="color:#e67e22;font-weight:700">${adel.sacos} saco(s) — ${(adel.sacos*kgPorSaco).toFixed(1)} kg</span>
            </div>`;
        });

        if (ped.totalSacos < 6) {
            html += `<div style="background:#fff3cd;padding:8px 12px;border-radius:6px;margin-top:8px;font-size:12px">
                ⚠️ Solo ${ped.totalSacos} sacos — considera si vale la pena pagar envío o esperar al siguiente pedido
            </div>`;
        }

        html += `</div></div>`;
    });

    div.innerHTML = html;
}

function mostrarReceta() {
    const f = document.getElementById('prepFormula')?.value;
    const k = parseFloat(document.getElementById('prepKilos')?.value);
    const caja = document.getElementById('cajaReceta');
    const lista = document.getElementById('listaReceta');
    if (!f||!k||!caja||!lista) { if(caja) caja.style.display='none'; return; }
    const receta = getRecetas()[f];
    if (!receta) { caja.style.display='none'; return; }
    caja.style.display='block';
    lista.innerHTML = Object.entries(receta).map(([ing,v]) => {
        const cant = ((v/500)*k).toFixed(2);
        const stockIng = getStock(ing);
        const ok = stockIng >= parseFloat(cant);
        return `<li style="color:${ok?'#27ae60':'#e74c3c'}">${ok?'✅':'⚠️'} <b>${cant} kg</b> ${ing} ${!ok?'(stock: '+stockIng.toFixed(1)+' kg)':''}</li>`;
    }).join('') + `<li style="color:#3498db;margin-top:8px">➕ <b>+${k} kg de ${f}</b></li>`;
}

async function regPreparar() {
    const f = document.getElementById('prepFormula')?.value;
    const k = parseFloat(document.getElementById('prepKilos')?.value);
    const fecha = document.getElementById('prepFecha')?.value||hoy();
    const lote = '';
    if (!f||!k) return mostrarMensaje('Selecciona fórmula y kilos', 'error');
    const receta = getRecetas()[f];
    mostrarModal('Confirmar Preparación', `<b>${f}</b> — ${k} kg<br>Fecha: ${fecha}`, async () => {
        const insumos = [];
        for (const ing in receta) {
            const cant = (receta[ing]/500)*k;
            insumos.push({nombre:ing, cantidad:cant});
            const s = DB.stock.find(st=>st.nombre===ing);
            if (s) s.cantidad -= cant; else DB.stock.push({nombre:ing, cantidad:-cant});
        }
        const nombrePrep = '🥣 '+f;
        const s = DB.stock.find(st=>st.nombre===nombrePrep);
        if (s) s.cantidad += k; else DB.stock.push({nombre:nombrePrep, cantidad:k});
        // tambien actualizar stock sin emoji para que coincida con sheet
        const sBase = DB.stock.find(st=>st.nombre===f);
        if (sBase) sBase.cantidad += k; else DB.stock.push({nombre:f, cantidad:k});
        guardarLocal();
        const res = await enviarAlSheet('guardarPreparacion', {fecha, formulaPreparada:f, kgPreparados:k, insumos, lote});
        if (!res.success) PENDIENTES.push({accion:'guardarPreparacion', datos:{fecha, formulaPreparada:f, kgPreparados:k, insumos, lote}});
        mostrarMensaje(res.success ? '✅ Preparación registrada' : '⚠️ Guardado local. Sincroniza.', res.success?'ok':'info');
        renderizar(vistaActual);
    });
}

function actualizarCamposVenta() {
    const div = document.getElementById('vCamposLotes');
    if (!div) return;
    let html = '';
    DB.lotes.forEach((l, i) => {
        const chk = document.getElementById(`chkLote${i}`);
        if (!chk || !chk.checked) return;
        const esP = (l.especie||'').toLowerCase().includes('pato');
        const sexoLabel = l.sexo === 'M' ? ' ♂ Machos' : l.sexo === 'H' ? ' ♀ Hembras' : '';
        html += `<div style="background:#f0fff4;padding:10px;border-radius:8px;margin-bottom:8px;border-left:3px solid #27ae60">
            <div style="font-size:13px;font-weight:700;margin-bottom:8px">${l.id}${sexoLabel}</div>
            <div class="form-row">
                <div><label>Cabezas</label><input type="number" id="vCab_${i}" placeholder="0" oninput="calcTotV()" max="${l.cantidad}"></div>
                ${esP ? `<div><label>Peso (kg)</label><input type="number" id="vKg_${i}" placeholder="0.0" oninput="calcTotV()"></div>` : ''}
            </div>
            ${!esP ? `<label>Peso total (kg)</label><input type="number" id="vKg_${i}" placeholder="0.0" oninput="calcTotV()">` : ''}
        </div>`;
    });
    div.innerHTML = html;
    calcTotV();
}

function calcTotV() {
    let kgTotal = 0;
    let hayDatos = false;
    DB.lotes.forEach((l, i) => {
        const chk = document.getElementById(`chkLote${i}`);
        if (!chk || !chk.checked) return;
        const kg = parseFloat(document.getElementById(`vKg_${i}`)?.value)||0;
        kgTotal += kg;
        if (kg > 0) hayDatos = true;
    });
    const pr = parseFloat(document.getElementById('vPrecio')?.value)||0;
    const r = document.getElementById('vResumen');
    if (hayDatos && pr > 0 && r) {
        r.style.display = 'block';
        r.innerHTML = `💰 S/ ${(kgTotal * pr).toFixed(2)} <small style="font-size:14px;color:#718096">(${kgTotal.toFixed(1)} kg)</small>`;
    } else if (r) r.style.display = 'none';
}

async function venderMulti(tipo) {
    if (!cliV) return mostrarMensaje('Selecciona un cliente', 'error');
    const pr = parseFloat(document.getElementById('vPrecio')?.value);
    if (!pr) return mostrarMensaje('Ingresa el precio', 'error');
    const fecha = document.getElementById('vFecha')?.value || hoy();
    const metodoPago = tipo === 'contado' ? (document.getElementById('vMetodoPago')?.value || 'Efectivo') : 'Crédito';

    const lotesSeleccionados = [];
    DB.lotes.forEach((l, i) => {
        const chk = document.getElementById(`chkLote${i}`);
        if (!chk || !chk.checked) return;
        const cab = parseInt(document.getElementById(`vCab_${i}`)?.value)||0;
        const kg = parseFloat(document.getElementById(`vKg_${i}`)?.value)||0;
        if (!cab || !kg) return;
        if (cab > l.cantidad) { mostrarMensaje(`${l.id}: solo hay ${l.cantidad} animales`, 'error'); return; }
        lotesSeleccionados.push({ lote: l, idx: i, cab, kg });
    });

    if (!lotesSeleccionados.length) return mostrarMensaje('Completa cabezas y peso para al menos un lote', 'error');

    const kgTotal = lotesSeleccionados.reduce((s,x) => s+x.kg, 0);
    const cabTotal = lotesSeleccionados.reduce((s,x) => s+x.cab, 0);
    const total = kgTotal * pr;
    const c = DB.clientes.find(x => x.id === cliV.id);

    let resumenHTML = lotesSeleccionados.map(x =>
        `<div style="padding:4px 0">${x.lote.id}: <b>${x.cab} cabezas — ${x.kg} kg</b></div>`
    ).join('');
    resumenHTML += `<div style="margin-top:8px;font-size:18px;font-weight:700">Total: ${kgTotal.toFixed(1)} kg — S/ ${total.toFixed(2)}</div>`;

    mostrarModal(tipo==='contado'?'💰 Contado':'💳 Crédito',
        `<b>${c?.nombre}</b><br>${resumenHTML}`,
        async () => {
            if (tipo === 'contado') {
                const mpDiv = document.getElementById('vMetodoPagoDiv');
                if (mpDiv) mpDiv.style.display = 'block';
            }
            for (const x of lotesSeleccionados) {
                const subtotal = x.kg * pr;
                const v = {
                    id: (tipo==='contado'?'VC_':'VCR_')+Date.now()+'_'+x.idx,
                    clienteId: cliV.id,
                    loteId: x.lote.id,
                    especie: x.lote.especie,
                    cabezas: x.cab,
                    kg: x.kg,
                    precio: pr,
                    total: subtotal,
                    fecha, tipo, metodoPago,
                    sexo: x.lote.sexo || '',
                    anulado: false
                };
                if (tipo==='contado') DB.ventasContado.push(v);
                else DB.ventasCredito.push(v);
                x.lote.cantidad -= x.cab;
                if (x.lote.cantidad <= 0) DB.lotes = DB.lotes.filter(l => l.id !== x.lote.id);
                const res = await enviarAlSheet('guardarVenta', v);
                if (!res.success) PENDIENTES.push({accion:'guardarVenta', datos:v});
            }
            guardarLocal();
            mostrarTicketMulti(tipo, {
                cliente: c?.nombre||'?',
                lotes: lotesSeleccionados,
                precio: pr,
                kgTotal,
                cabTotal,
                total: total.toFixed(2),
                fecha,
                metodoPago
            });
            renderizar(vistaActual);
        });
}

async function regAbono(){if(!cliA)return mostrarMensaje('Selecciona cliente','error');const m=parseFloat(document.getElementById('abonoMonto')?.value),met=document.getElementById('abonoMetodo')?.value,f=document.getElementById('abonoFecha')?.value;if(!m)return mostrarMensaje('Ingresa monto','error');const c=DB.clientes.find(x=>x.id===cliA.id);const tv=DB.ventasCredito.filter(v=>v.clienteId===cliA.id).reduce((s,v)=>s+v.total,0),ta=DB.abonos.filter(a=>a.clienteId===cliA.id).reduce((s,a)=>s+a.monto,0),da=Math.max(0,tv-ta);mostrarModal('Confirmar Abono',`<b>${c?.nombre}</b><br>S/ ${m.toFixed(2)}<br>Deuda antes: S/ ${da.toFixed(2)}<br>Nueva deuda: S/ ${Math.max(0,da-m).toFixed(2)}`,async()=>{const ab={id:'AB_'+Date.now(),clienteId:cliA.id,monto:m,metodo:met,fecha:f||hoy()};DB.abonos.push(ab);guardarLocal();const res=await enviarAlSheet('guardarAbono',ab);if(!res.success)PENDIENTES.push({accion:'guardarAbono',datos:ab});mostrarTicketAbono({cliente:c?.nombre,monto:m,metodo:met,deudaAnterior:da,nuevaDeuda:Math.max(0,da-m),saldoPendiente:Math.max(0,da-m)});renderizar(vistaActual);});}

function initGastos(){const gf=document.getElementById('gastoFecha');if(gf)gf.valueAsDate=new Date();renderGastos();}
async function regGasto(){const c=document.getElementById('gastoConcepto')?.value,d=document.getElementById('gastoDetalle')?.value.trim(),m=parseFloat(document.getElementById('gastoMonto')?.value),f=document.getElementById('gastoFecha')?.value||hoy();if(!m)return mostrarMensaje('Ingresa monto','error');const g={fecha:f,concepto:d?c+' - '+d:c,monto:m};mostrarModal('Confirmar Gasto',`${g.concepto}<br>S/ ${m.toFixed(2)}`,async()=>{DB.gastos.unshift({id:'G_'+Date.now(),...g});guardarLocal();const res=await enviarAlSheet('guardarGasto',g);if(!res.success)PENDIENTES.push({accion:'guardarGasto',datos:g});mostrarMensaje('✅ Gasto registrado');renderizar(vistaActual);});}
function renderGastos(){const div=document.getElementById('listaGastos');if(!div)return;div.innerHTML=DB.gastos.slice(0,20).map(g=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e2e8f0;font-size:13px"><div><b>${g.concepto||''}</b><br><small>${g.fecha}</small></div><div style="color:#e74c3c;font-weight:700;white-space:nowrap">S/ ${(parseFloat(g.monto)||0).toFixed(2)}</div></div>`).join('')||'<p style="color:#718096">Sin gastos</p>';}

// ============ MORTALIDAD ============
function vMortalidad(){return`${topbarHTML('💀 Mortalidad')}<div class="grid-2"><div class="card"><div class="card-header">➕ Registrar</div><label>Lote</label><select id="mortLote">${DB.lotes.map((l,i)=>`<option value="${i}">${l.id} (${l.cantidad})</option>`).join('')}</select><div class="form-row"><div><label>Cantidad</label><input type="number" id="mortCant"></div><div><label>Causa</label><select id="mortCausa"><option>Enfermedad</option><option>Accidente</option><option>Selección</option><option>Descarte</option><option>Desconocida</option></select></div></div><label>Detalle</label><input type="text" id="mortDetalle" placeholder="Observaciones"><label>Fecha</label><input type="date" id="mortFecha"><button class="btn btn-danger" onclick="regMortalidad()" style="width:100%">💀 Registrar</button></div><div class="card"><div class="card-header">📋 Historial</div><div id="listaMortalidad"></div></div></div>`;}
function initMortalidad(){const mf=document.getElementById('mortFecha');if(mf)mf.valueAsDate=new Date();renderMortalidad();}
async function regMortalidad(){const idx=document.getElementById('mortLote')?.value,cant=parseInt(document.getElementById('mortCant')?.value),causa=document.getElementById('mortCausa')?.value,detalle=document.getElementById('mortDetalle')?.value.trim()||'',fecha=document.getElementById('mortFecha')?.value||hoy();if(idx===''||idx===undefined||!cant)return mostrarMensaje('Selecciona lote y cantidad','error');const l=DB.lotes[parseInt(idx)];if(!l)return;if(cant>l.cantidad)return mostrarMensaje(`Solo hay ${l.cantidad}`,'error');mostrarModal('Confirmar',`<b>${l.id}</b><br>${cant} ${l.especie}<br>${causa}`,async()=>{const m={id:'MORT_'+Date.now(),loteId:l.id,especie:l.especie,cantidad:cant,causa,detalle,fecha};DB.mortalidad.push(m);l.cantidad-=cant;if(l.cantidad<=0)DB.lotes=DB.lotes.filter(x=>x.id!==l.id);guardarLocal();const resMort=await enviarAlSheet('guardarMortalidad',m);if(!resMort.success)PENDIENTES.push({accion:'guardarMortalidad',datos:m});// Actualizar cantidad en lote del sheet
if(l.cantidad>0){const resLote=await enviarAlSheet('editarLote',{id:l.id,cantidad:l.cantidad});if(!resLote.success)PENDIENTES.push({accion:'editarLote',datos:{id:l.id,cantidad:l.cantidad}});}mostrarMensaje('✅ Mortalidad registrada');renderizar(vistaActual);});}
function renderMortalidad(){const div=document.getElementById('listaMortalidad');if(!div)return;div.innerHTML=DB.mortalidad.slice(0,20).map(m=>`<div style="padding:8px 0;border-bottom:1px solid #e2e8f0;font-size:13px"><b>${m.loteId}</b>: ${m.cantidad} ${m.especie} — ${m.causa}${m.detalle?' ('+m.detalle+')':''}<br><small>${m.fecha}</small></div>`).join('')||'<p style="color:#718096">Sin registros</p>';}

// ============ STOCK ============
function vStock(){
    const FORMULAS_ALIMENTO = ['Pato Inicio','Pato Crecimiento','Pato Acabado','Cerdo Inicio','Cerdo Crecimiento','Cerdo Desarrollo','Cerdo Acabado','Corimicyn'];
    const insumosBase = DB.stock.filter(s => !FORMULAS_ALIMENTO.includes((s.nombre||'').replace('🥣 ','')));
    const alimentoPrep = DB.stock.filter(s => FORMULAS_ALIMENTO.includes((s.nombre||'').replace('🥣 ','')));
    return`${topbarHTML('📦 Stock')}<div class="grid-2"><div class="card"><div class="card-header">🌽 Insumos Base</div>${insumosBase.map(s=>{const c=parseFloat(s.cantidad)||0;return`<div class="stock-item"><div><b>${s.nombre}</b></div><div style="color:${c<=0?'#e74c3c':c<10?'#e67e22':'#27ae60'};font-weight:700">${c.toFixed(2)} kg</div></div>`;}).join('')||'<p style="color:#718096">Sin datos. Sincroniza.</p>'}</div><div class="card"><div class="card-header">🥣 Alimento Preparado</div>${alimentoPrep.map(s=>{const c=parseFloat(s.cantidad)||0;return`<div class="stock-item"><div><b>${s.nombre.replace('🥣 ','')}</b></div><div style="color:${c<=0?'#e74c3c':c>0?'#27ae60':'#718096'};font-weight:700">${c.toFixed(2)} kg</div></div>`;}).join('')||'<p style="color:#718096">Sin alimento preparado</p>'}</div></div>`;
}

// ============ TICKETS ============
function vTickets(){return`${topbarHTML('🧾 Tickets')}<div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px"><input type="text" id="tktBuscar" placeholder="🔍 Buscar..." oninput="renderTickets()" style="flex:1;min-width:150px;margin:0"><input type="date" id="tktDesde" onchange="renderTickets()" style="width:160px;margin:0"><input type="date" id="tktHasta" onchange="renderTickets()" style="width:160px;margin:0"></div><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Total</th><th>Tipo</th><th></th></tr></thead><tbody id="tktTabla"></tbody></table></div>`;}
function initTickets(){const th=document.getElementById('tktHasta');if(th)th.valueAsDate=new Date();renderTickets();}
function renderTickets(){const buscar=(document.getElementById('tktBuscar')?.value||'').toLowerCase(),desde=document.getElementById('tktDesde')?.value||'',hasta=document.getElementById('tktHasta')?.value||'9999-12-31';const todas=[...DB.ventasContado.map(v=>({...v,tipo:'contado'})),...DB.ventasCredito.map(v=>({...v,tipo:'credito'})),...DB.abonos.map(a=>({id:a.id,fecha:a.fecha,clienteId:a.clienteId,total:a.monto,tipo:'abono'}))].filter(v=>{if(desde&&v.fecha<desde)return false;if(v.fecha>hasta)return false;if(buscar){const c=DB.clientes.find(x=>x.id===v.clienteId);return c?.nombre.toLowerCase().includes(buscar);}return true;}).sort((a,b)=>b.fecha.localeCompare(a.fecha));const tb=document.getElementById('tktTabla');if(tb)tb.innerHTML=todas.slice(0,50).map(v=>{const c=DB.clientes.find(x=>x.id===v.clienteId);return`<tr><td>${v.fecha}</td><td>${c?.nombre||'?'}</td><td>S/ ${v.total.toFixed(2)}</td><td><span class="badge ${v.tipo==='contado'?'badge-green':v.tipo==='credito'?'badge-orange':'badge-blue'}">${v.tipo}</span></td><td><button class="btn btn-accent btn-xs" onclick="verTicket('${v.id}','${v.tipo}')">🧾</button></td></tr>`;}).join('')||'<tr><td colspan="5" style="text-align:center;color:#718096">Sin registros</td></tr>';}
function verTicket(id,tipo){if(tipo==='abono'){const a=DB.abonos.find(x=>x.id===id);if(a){const c=DB.clientes.find(x=>x.id===a.clienteId);mostrarTicketAbono({cliente:c?.nombre||'?',monto:a.monto,metodo:a.metodo||'Efectivo',deudaAnterior:0,nuevaDeuda:0,saldoPendiente:0});}}else{const v=tipo==='contado'?DB.ventasContado.find(x=>x.id===id):DB.ventasCredito.find(x=>x.id===id);if(v){const c=DB.clientes.find(x=>x.id===v.clienteId);mostrarTicket(tipo,{cliente:c?.nombre||'?',especie:v.especie,cabezas:v.cabezas,kg:v.kg,precio:v.precio,total:v.total.toFixed(2),fecha:v.fecha});}}}

function mostrarTicket(tipo,d){const html=`<div style="text-align:center;border-bottom:2px dashed #000;padding-bottom:10px;margin-bottom:10px"><h2 style="font-family:monospace">🌾 El Porton de la Calichera 🌽</h2><p style="font-family:monospace">997 884 114 — TICKET ${tipo.toUpperCase()}</p><p style="font-family:monospace">${d.fecha||hoy()}</p></div><p style="font-family:monospace"><b>Cliente:</b> ${d.cliente}</p><p style="font-family:monospace"><b>${d.especie}</b></p>${d.cabezas?`<p style="font-family:monospace">Cabezas: ${d.cabezas}</p>`:''}<p style="font-family:monospace">Peso: ${d.kg} kg</p><p style="font-family:monospace">Precio: S/ ${parseFloat(d.precio).toFixed(2)}/kg</p>${d.metodoPago?`<p style="font-family:monospace">Método: ${d.metodoPago}</p>`:''}<p style="font-family:monospace;font-size:20px;font-weight:700;text-align:right;border-top:2px solid #000;padding-top:8px;margin-top:8px">TOTAL: S/ ${d.total}</p><p style="font-family:monospace;text-align:center">${tipo==='contado'?'✅ PAGADO':'⏳ PENDIENTE'}</p>`;document.getElementById('modalContainer').innerHTML=`<div class="modal-overlay" id="mo"><div class="modal" style="max-width:480px"><h3>🧾 Ticket</h3><div id="ticketContent" style="border:1px solid #ddd;padding:16px;border-radius:8px">${html}</div><div class="modal-actions"><button class="btn btn-whatsapp" onclick="compartirTicket()">💬 WhatsApp</button><button class="btn btn-accent" onclick="window.print()">🖨️</button><button class="btn btn-primary" onclick="cerrarModal()">Cerrar</button></div></div></div>`;document.getElementById('mo').onclick=e=>{if(e.target.id==='mo')cerrarModal();};}
function mostrarTicketAbono(d){const html=`<div style="text-align:center;font-family:monospace"><h2>🌾 El Porton de la Calichera 🌽</h2><p>997 884 114 — ABONO — ${hoy()}</p><hr><p><b>Cliente:</b> ${d.cliente}</p><p>Abono: <b>S/ ${parseFloat(d.monto).toFixed(2)}</b> — ${d.metodo}</p><p style="font-weight:700;font-size:18px">Pendiente: S/ ${parseFloat(d.saldoPendiente).toFixed(2)}</p></div>`;document.getElementById('modalContainer').innerHTML=`<div class="modal-overlay" id="mo"><div class="modal" style="max-width:480px"><h3>💳 Abono</h3><div id="ticketContent" style="border:1px solid #ddd;padding:16px;border-radius:8px">${html}</div><div class="modal-actions"><button class="btn btn-whatsapp" onclick="compartirTicket()">💬</button><button class="btn btn-primary" onclick="cerrarModal()">Cerrar</button></div></div></div>`;document.getElementById('mo').onclick=e=>{if(e.target.id==='mo')cerrarModal();};}
async function compartirTicket(){const cont=document.getElementById('ticketContent');if(!cont)return;try{const canvas=await html2canvas(cont,{backgroundColor:'#ffffff',scale:2});const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const file=new File([blob],'ticket.png',{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Ticket El Portón'});}else{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ticket.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}}catch(e){window.open('https://wa.me/','_blank');}}

document.addEventListener('click', e => {
    ['dropdownClientesV','dropdownClientesA'].forEach(id => {
        const dd=document.getElementById(id);
        if(dd&&!dd.contains(e.target)) dd.classList.remove('show');
    });
});
</script>
